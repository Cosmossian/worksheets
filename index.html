   His start screen in the Spelling Helper shows each one as a button; do.html runs it (fixup.html for Spelling Fix-Up). */
const SB_URL = 'https://wpgclwmssnmiidvnekml.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwZ2Nsd21zc25taWlkdm5la21sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzE4NDUsImV4cCI6MjEwOTE0Nzg0NX0.o19X9l7zS1bk34DpR3id0gt6mAB42ZZb6olRr8ohzTc';
const TOOL_NAMES = { sight: 'Sight Word Practice', master: 'Word Master Challenge', fixup: 'Spelling Fix-Up', question: 'What Is the Question Asking?', steps: 'Daily Steps', eagles: 'Count the Eagles', weather: 'My Weather Watch', mtest: 'Mastered Words Test', ...Object.fromEntries(L_IDS.map(k => [k, LT[k].name])) };
let sbc = null;
const sbClient = () => sbc || (window.supabase && window.supabase.createClient ? (sbc = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'study-auth', persistSession: true, autoRefreshToken: true } })) : null);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
function snapshot(t) {   // what the on-screen worksheet needs, frozen at the moment you assign it
  if (LT[t]) return L_snapshot(t);
  if (t === 'sight') { const words = parseWords(state.sight.words); return { title: TOOL_NAMES.sight + (state.sight.label.trim() ? ' · ' + state.sight.label.trim() : ''), data: { words, label: state.sight.label.trim(), sentences: Object.fromEntries(words.map(w => [w, sentenceFor('sight', w)])) }, ok: words.length > 0 }; }
  if (t === 'master') { const words = parseWords(state.master.words); return { title: TOOL_NAMES.master, data: { words, sentences: Object.fromEntries(words.map(w => [w, sentenceFor('master', w)])), icons: Object.fromEntries(words.map(w => [w, iconFor(w)])) }, ok: words.length > 0 }; }
  if (t === 'fixup') { const words = parseWords(state.fixup.words); return { title: TOOL_NAMES.fixup + (state.fixup.label.trim() ? ' · ' + state.fixup.label.trim() : ''), data: { words: words.map(w => ({ w, his: state.fixup.wrote[w] || '' })) }, ok: words.length > 0 }; }
  if (t === 'question') { const all = [...QUESTIONS, ...state.question.custom]; const its = state.question.picked.map(i => all[i]).filter(Boolean); return { title: state.question.title.trim() || TOOL_NAMES.question, data: { items: its, wordBank: state.question.wordBank, example: state.question.example }, ok: its.length > 0 }; }
  if (t === 'steps') return { title: state.steps.heading.trim() || TOOL_NAMES.steps, data: structuredClone(state.steps), ok: state.steps.steps.length > 0 };
  if (t === 'weather') return { title: TOOL_NAMES.weather, data: structuredClone(state.weather), ok: !!state.weather.place, need: 'Find where you live first (above), so it can use your real weather.' };
  return { title: TOOL_NAMES.eagles, data: {}, ok: true };
}
const onScreenBlock = () => `<div class="onscreen"><h3>On screen</h3><p class="help" style="margin:0 0 8px">Saves paper. He does it on his device, and you get the grade by email and in Parent Review.</p>
  <label class="assign-day">For <select id="assignDay"></select></label>
  <div class="btn-row"><button class="btn btn-assign" id="assignBtn">Assign to his device</button>${state.tool === 'fixup' ? '' : '<button class="btn btn-small" id="tryBtn">Try it on screen</button>'}</div>
  <div class="assign-msg" id="assignMsg"></div><div class="assigned" id="assignedList"></div></div>`;
const amsg = (t, bad) => { const m = document.getElementById('assignMsg'); if (m) { m.innerHTML = t; m.style.color = bad ? 'var(--warn-ink)' : '#34D399'; } };
async function studySession() {
  const sb = sbClient(); if (!sb) return null;
  try { const { data } = await sb.auth.getSession(); return data.session ? sb : null; } catch (e) { return null; }
}
const dayOf = t => { const x = new Date(t); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
/* Which day a worksheet is for (Nov 9, 2026, Dylan: "assign to his next day… something to assign to a day and something to review per day").
   a.day is picked when assigning; older ones use the school worksheet's day, or the day they were assigned. On his list for day ds:
   its own day; Daily Steps and Weather Watch every day from then on; the Mastered Words Test only on its day; any other worksheet he
   didn't finish on its day carries over to the next days until he does it. Same rule in spell.html (his start screen). */
const RECUR = ['steps', 'weather'];
const sheetDay = a => a.day || (a.data && a.data.schoolDay) || (a.data && a.data.exact ? '2026-11-09' : dayOf(a.at));   // the old undated “📄 School copy” ones were all the 11/09/26 sheets
function onList(a, ds, doneDays) {
  const d = sheetDay(a);
  if (a.tool === 'mtest') return d === ds;
  if (d > ds) return false;
  if (d === ds || RECUR.includes(a.tool)) return true;
  return !doneDays(a).some(x => x < ds);
}
const addDays = (ds, n) => { const x = new Date(ds + 'T12:00:00'); x.setDate(x.getDate() + n); return dayOf(x); };
const dayName = (ds, long) => { const x = new Date(ds + 'T12:00:00'), t = dayOf(Date.now()), rel = ds === t ? 'today' : ds === addDays(t, 1) ? 'tomorrow' : ds === addDays(t, -1) ? 'yesterday' : '';
  const base = long ? x.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }) : `${x.toLocaleDateString(undefined, { weekday: 'short' })} ${x.getMonth() + 1}/${x.getDate()}`; return rel ? `${base} (${rel})` : base; };
const expired = a => (a.tool === 'mtest' && sheetDay(a) < dayOf(Date.now())) || (!RECUR.includes(a.tool) && sheetDay(a) < addDays(dayOf(Date.now()), -21));   // the Mastered Words Test is only for its day; anything 3 weeks old is tidied away
async function loadSheets(sb) {
  const { data, error } = await sb.from('study_state').select('data').eq('key', 'sheets').maybeSingle();
  if (error) throw error;
  const list = (data && data.data && data.data.list) || [];
  if (list.some(expired)) { const keep = list.filter(a => !expired(a)); try { await saveSheets(sb, keep); } catch (e) { } return keep; }   // tidy up yesterday's test and old work
  return list;
}
async function saveSheets(sb, list) {
  const r = await sb.from('study_state').upsert({ key: 'sheets', data: { list }, updated_at: new Date().toISOString() });
  if (r.error) throw r.error;
  lsSet('study-sheets', { list });   // so this device's Spelling Helper shows it right away too
}
async function renderAssigned() {
  const el = document.getElementById('assignedList'); if (!el) return;
  const sb = await studySession();
  if (!sb) { el.innerHTML = ''; return; }
  try {
    const list = await loadSheets(sb); refreshOnDay(list);
    const since = new Date(Date.now() - 30 * 864e5).toISOString();
    const { data: logs } = await sb.from('study_log').select('kind,t,data').in('kind', ['sheet', 'fixup']).gte('t', since);
    const today = new Date().toDateString(), td = dayOf(Date.now());
    const doneFor = a => (logs || []).map(r => r.data).filter(d => (d.aid || d.cid) === a.id && (!['steps', 'weather'].includes(a.tool) || new Date(d.t).toDateString() === today)).sort((x, y) => y.t - x.t)[0];
    const doneDays = a => (logs || []).map(r => r.data).filter(d => (d.aid || d.cid) === a.id).map(d => dayOf(d.t));
    const shown = list.filter(a => sheetDay(a) > td || onList(a, td, doneDays)).sort((x, y) => sheetDay(x).localeCompare(sheetDay(y)));   // today's (and carried-over) work, then what's coming
    if (!document.getElementById('assignedList')) return;
    document.getElementById('assignedList').innerHTML = shown.length ? `<b style="font-size:14px">On his device:</b>` + shown.map(a => {
      const d = doneFor(a), g = d && d.grade, sd = sheetDay(a), when = sd > td ? `for ${dayName(sd)}` : sd < td && !RECUR.includes(a.tool) ? `from ${dayName(sd)}, not done yet` : RECUR.includes(a.tool) && sd < td ? 'every day' : 'for today';
      return `<div><span>${esc(a.title)}<br><small style="color:var(--muted)">${esc(when)} · assigned ${esc(checkDate(a.at))}</small></span>${d ? `<span class="ok">✓ ${g ? `${g.letter} ${g.pct}%` : a.tool === 'weather' && d.extra && d.extra.day ? `day ${d.extra.day} today` : a.tool === 'steps' ? 'today' : 'done'}</span>` : ''}<button class="btn btn-small" data-unassign="${esc(a.id)}" aria-label="Remove ${esc(a.title)} from his device">Remove</button></div>`;
    }).join('') : '';
  } catch (e) { el.innerHTML = ''; }
}
function wireWeather() {
  const found = (t, ok) => { const f = document.getElementById('wxFound'); f.innerHTML = t; f.style.color = ok ? '#34D399' : 'var(--warn-ink)'; };
  document.getElementById('wxFind').onclick = async () => {
    found('Looking…', true);
    try { state.weather.place = await findPlace(document.getElementById('wxWhere').value); save(); found(`Weather for: ${esc(state.weather.place.name)} ✓`, true); scheduleRender(); }
    catch (e) { found(esc(e.message || 'Couldn’t look that up right now.'), false); }
  };
  document.getElementById('wxHere').onclick = () => {
    if (!navigator.geolocation) return found('This browser can’t share its location. Type a ZIP code instead.', false);
    found('Asking the browser…', true);
    navigator.geolocation.getCurrentPosition(p => { state.weather.place = { q: '', name: 'My location', lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }; save(); found('Weather for: My location ✓', true); scheduleRender(); },
      () => found('The location wasn’t shared. Type a ZIP code instead.', false), { timeout: 15000 });
  };
  document.getElementById('wxWhere').onkeydown = e => { if (e.key === 'Enter') document.getElementById('wxFind').click(); };
}
function wireOnScreen() {
  const t = state.tool, today = dayOf(Date.now()), sel = document.getElementById('assignDay');
  // which day: the school worksheet's own day if it's coming up, otherwise today (or the day picked last time on this tab, if still ahead)
  const want = (() => { const sd = (snapshot(t).data || {}).schoolDay; if (sd && sd >= today) return sd; const last = (state.assignDay || {})[t]; return last && last > today ? last : today; })();
  const days = Array.from({ length: 10 }, (_, k) => addDays(today, k)); if (!days.includes(want)) days.push(want);
  sel.innerHTML = days.map(ds => `<option value="${ds}" ${ds === want ? 'selected' : ''}>${esc(dayName(ds))}</option>`).join('');
  sel.onchange = () => { state.assignDay = { ...(state.assignDay || {}), [t]: sel.value }; save(); };
  document.getElementById('assignBtn').onclick = async () => {
    const snap = snapshot(t);
    if (!snap.ok) return amsg(snap.need || 'Add some words or questions first.', true);
    const sb = await studySession();
    if (!sb) return amsg('Sign in first on the <a href="spell.html">Spelling Helper</a> page (the “Shared across devices” box), then come back and assign it.', true);
    amsg('Assigning…');
    try {
      const day = sel.value || today;
      const list = (await loadSheets(sb)).filter(a => !(a.tool === t && a.title === snap.title && sheetDay(a) === day));   // re-assigning replaces the same worksheet on the same day
      list.push({ id: Date.now().toString(36), tool: t, title: snap.title, at: Date.now(), day, data: snap.data });
      await saveSheets(sb, list.slice(-40));
      amsg(day === today ? `Assigned ✓ “${esc(snap.title)}” is on his start screen now.` : `Assigned ✓ “${esc(snap.title)}” for ${esc(dayName(day, true))}. It shows up on his start screen that day.`);
      renderAssigned();
    } catch (e) { amsg(`Couldn’t assign it: ${esc(e.message || e)}. Check the internet and try again.`, true); }
  };
  const tryBtn = document.getElementById('tryBtn');
  if (tryBtn) tryBtn.onclick = () => {
    const snap = snapshot(t);
    if (!snap.ok) return amsg(snap.need || 'Add some words or questions first.', true);
    lsSet('study-sheet-try', { id: 'try', tool: t, title: snap.title, at: Date.now(), data: snap.data });
    window.open('do.html?try=1', '_blank');
  };
  document.getElementById('assignedList').onclick = async e => {
    const b = e.target.closest('[data-unassign]'); if (!b) return;
    const sb = await studySession(); if (!sb) return;
    b.disabled = true;
    try { await saveSheets(sb, (await loadSheets(sb)).filter(a => a.id !== b.dataset.unassign)); amsg('Removed from his device.'); }
    catch (er) { amsg(`Couldn’t remove it: ${esc(er.message || er)}`, true); }
    renderAssigned();
  };
  renderAssigned();
}

/* ---------- events ---------- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tool]'); if (!b) return;
  state.tool = b.dataset.tool; state.cls = classOf(state.tool); save(); history.replaceState(null, '', '#' + state.tool); renderPanel();
});

let cardsTimer;
$panel.addEventListener('input', e => {
  const el = e.target, t = state.tool;
  if (L_input(el)) { save(); scheduleRender(); return; }
  if (t === 'sight') {
    if (el.id === 'sLabel') state.sight.label = el.value;
    if (el.id === 'sWords') { state.sight.words = el.value; clearTimeout(cardsTimer); cardsTimer = setTimeout(() => { document.getElementById('cards').innerHTML = wordCards('sight'); }, 400); }
    if (el.dataset.sent) state.sight.sentences[el.dataset.sent] = el.value;
  } else if (t === 'master') {
    if (el.id === 'mWords') { state.master.words = el.value; clearTimeout(cardsTimer); cardsTimer = setTimeout(() => { document.getElementById('cards').innerHTML = wordCards('master'); }, 400); }
    if (el.dataset.sent) state.master.sentences[el.dataset.sent] = el.value;
  } else if (t === 'fixup') {
    if (el.id === 'fLabel') state.fixup.label = el.value;
    if (el.id === 'fWords') { state.fixup.words = el.value; clearTimeout(cardsTimer); cardsTimer = setTimeout(() => { document.getElementById('cards').innerHTML = wordCards('fixup'); }, 400); }
    if (el.dataset.sent) state.fixup.sentences[el.dataset.sent] = el.value;
    if (el.dataset.wrote) state.fixup.wrote[el.dataset.wrote] = el.value;
  } else if (t === 'question') {
    if (el.id === 'qTitle') state.question.title = el.value;
  } else if (t === 'steps') {
    const st = state.steps;
    if (el.id === 'tHead') st.heading = el.value;
    if (el.id === 'tSub') st.sub = el.value;
    if (el.dataset.stext) st.steps[+el.dataset.stext].text = el.value;
    if (el.dataset.snote) st.steps[+el.dataset.snote].noteText = el.value;
    if (el.dataset.rem) st.reminders[+el.dataset.rem] = el.value;
  }
  save(); scheduleRender();
});

$panel.addEventListener('change', e => {
  const el = e.target, t = state.tool;
  if (L_input(el)) { save(); scheduleRender(); return; }
  if (t === 'sight' && el.id === 'sParent') state.sight.showParent = el.checked;
  if (t === 'fixup' && el.id === 'fParent') state.fixup.showParent = el.checked;
  if (t === 'master' && el.dataset.icon) state.master.icons[el.dataset.icon] = el.value;
  if (t === 'question') {
    const q = state.question;
    if (el.id === 'qBank' || el.id === 'qEx') {
      q[el.id === 'qBank' ? 'wordBank' : 'example'] = el.checked;
      const max = q.wordBank ? 7 : (q.example ? 6 : 7);
      q.picked = q.picked.slice(0, max); save(); renderPanel(); return;
    }
    if (el.dataset.q !== undefined) {
      const i = +el.dataset.q, max = q.wordBank ? 7 : (q.example ? 6 : 7);
      if (el.checked) { if (q.picked.length >= max) { el.checked = false; alert(`You can pick up to ${max} questions for one page.`); return; } q.picked.push(i); }
      else q.picked = q.picked.filter(x => x !== i);
    }
  }
  if (t === 'weather') { if (el.name === 'wxUnit') state.weather.unit = el.value; if (el.id === 'wxDays') state.weather.days = +el.value; }
  if (t === 'steps') {
    const st = state.steps;
    if (el.dataset.sicon) st.steps[+el.dataset.sicon].icon = el.value;
    if (el.dataset.stype) { st.steps[+el.dataset.stype].noteType = el.value; save(); document.getElementById('stepCards').innerHTML = stepCards(); }
  }
  save(); scheduleRender();
});

$panel.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  const lc = L_click(el); if (lc) { save(); if (lc === 'panel') renderPanel(); else scheduleRender(); return; }
  if (el.id === 'fUseCheck') { const lc = latestCheck(); if (lc) useCheck(lc.results.filter(r => !r.ok), 'Sight word check · ' + checkDate(lc.t)); renderPanel(); return; }
  const st = state.steps;
  if (el.id === 'qShuffle') { state.question.picked = shuffle(state.question.picked, Date.now() % 9973); }
  else if (el.id === 'cAdd') {
    const q = document.getElementById('cq').value.trim(), k = document.getElementById('ck').value.trim(), a = document.getElementById('ca').value.trim();
    if (!q || !k || !a) { alert('Please fill in the question, what it wants, and the answer.'); return; }
    state.question.custom.push({ q, kind: k, answer: a, icon: document.getElementById('ci').value });
    const idx = QUESTIONS.length + state.question.custom.length - 1;
    const max = state.question.wordBank ? 7 : (state.question.example ? 6 : 7);
    if (state.question.picked.length < max) state.question.picked.push(idx);
    save(); renderPanel(); return;
  }
  else if (el.dataset.up) { const i = +el.dataset.up; [st.steps[i - 1], st.steps[i]] = [st.steps[i], st.steps[i - 1]]; }
  else if (el.dataset.down) { const i = +el.dataset.down; [st.steps[i + 1], st.steps[i]] = [st.steps[i], st.steps[i + 1]]; }
  else if (el.dataset.del) { st.steps.splice(+el.dataset.del, 1); }
  else if (el.id === 'addStep') { if (st.steps.length < 8) st.steps.push({ text: 'New step', icon: 'star', noteType: 'none', noteText: '' }); }
  else if (el.id === 'resetSteps') { if (!confirm('Start the chart over with the example steps?')) return; state.steps = structuredClone(DEFAULT_STEPS); save(); renderPanel(); return; }
  else return;
  save();
  if (state.tool === 'steps') document.getElementById('stepCards').innerHTML = stepCards(), document.getElementById('addStep').disabled = st.steps.length >= 8;
  scheduleRender();
});

window.addEventListener('resize', scheduleRender);
const fromLink = new URLSearchParams(location.search);
if (fromLink.get('fixup')) {
  useCheck(fromLink.get('fixup').split('|').map(p => { const [word, typed] = p.split(':'); return { word, typed: typed || '' }; }).filter(r => r.word), fromLink.get('fxl') || 'Sight word check');
  state.tool = 'fixup'; save();
  history.replaceState(null, '', location.pathname + '#fixup');
}
const fromHash = location.hash.slice(1);
if (['daily', 'helper', 'sight', 'master', 'fixup', 'question', 'steps', 'eagles', 'weather', 'chores', ...L_IDS].includes(fromHash)) { state.tool = fromHash; state.cls = classOf(fromHash); }
else if (CLASSES.some(c => c.id === fromHash)) state.cls = fromHash;
renderPanel();
// The Worksheets page is for grown-ups: nobody signed in → the Parent / Child screen; his login → his start screen.
(async () => {
  const sb = sbClient(), open = () => document.body.classList.remove('authwait');
  if (!sb) return open();   // the sign-in couldn't load (offline): printing still works
  let role = null;
  try {
    const { data } = await sb.auth.getSession();
    if (data.session) { const { data: m, error } = await sb.from('study_members').select('role').eq('email', data.session.user.email.toLowerCase()).maybeSingle(); if (error) return open(); role = m ? m.role : null; }
  } catch (e) { return open(); }
  if (role === 'grownup') return open();
  location.replace(role === 'kid' ? 'spell.html' : 'spell.html?next=' + encodeURIComponent('index.html' + location.hash));
})();
// Re-draw once the fonts arrive, so long words are measured with the real font.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPreview);
