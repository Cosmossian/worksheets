<style>
/* On-screen Spelling Fix-Up: the same six parts as the printed sheet, done on the computer.
   Same dark look as the Spelling Helper. One thing on screen at a time, big targets. */
:root { color-scheme: dark; --navy: #8DB8F2; --ink: #E5ECF4; --muted: #9AABBF; --line: #2B3A4D; --bg: #0E151D; --accent: #7FB0F0;
  --study: #3C7DD9; --surface: #16202B; --surface-2: #1C2836; --field: #0F1822; --field-line: #3A4B60;
  --good: #34D399; --good-bg: #0F2E25; --try: #FBBF24; --try-bg: #33270C; --bad: #F87171; --bad-bg: #3A1717; --part: #C4B5FD; --part-bg: #241C3D; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: Andika, system-ui, sans-serif; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #F59E0B; outline-offset: 3px; }
[hidden] { display: none !important; }

.app-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.app-header h1 { margin: 0; font: 700 24px Fredoka, sans-serif; color: var(--navy); }
.prog { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.prog span { font: 600 14px Fredoka, sans-serif; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.prog span.now { background: var(--study); border-color: var(--study); color: #fff; }
.prog span.done { color: var(--good); border-color: var(--good); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 18px Fredoka, sans-serif; border: 2px solid var(--line); border-radius: 14px; padding: 10px 18px; min-height: 48px; cursor: pointer; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--study); border-color: var(--study); color: #fff; }
.btn.big { font-size: 22px; padding: 14px 24px; min-height: 60px; border-radius: 18px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 24px; height: 24px; flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row.acts { gap: 64px; }
.nextbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--surface); border: 2px solid var(--study); border-radius: 999px; padding: 10px 22px; display: flex; align-items: center; gap: 14px; z-index: 60; font: 600 18px Fredoka, sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.nextbar i { width: 140px; height: 12px; border-radius: 999px; background: var(--field); overflow: hidden; display: block; }
.nextbar b { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; animation: nextfill linear forwards; }
@keyframes nextfill { to { width: 100%; } }
body.advancing main button, body.advancing main .key { pointer-events: none; }

main { max-width: 980px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.part-title { text-align: center; }
.part-title h2 { margin: 0; font: 700 28px Fredoka, sans-serif; }
.part-title p { margin: 2px 0 0; color: var(--muted); font-size: 17px; }
.message { min-height: 2.8em; max-width: 720px; line-height: 1.3; text-align: center; font: 600 24px Fredoka, sans-serif; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
.message.good { color: var(--good); } .message.try { color: var(--try); }
.count { font: 600 16px Fredoka, sans-serif; color: var(--muted); }

.big-word { font: 700 clamp(40px, 7vw, 60px) Andika, sans-serif; letter-spacing: 4px; background: #fff; color: #1F2937; border-radius: 18px; padding: 2px 24px; }
.big-word .t { text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 8px; }
.hidden-word { font: 700 28px Fredoka, sans-serif; padding: 10px 24px !important; color: var(--muted); border: 3px dashed var(--field-line); border-radius: 20px; padding: 16px 30px; }

.lbox { width: 58px; height: 72px; border-radius: 13px; border: 3px dashed var(--field-line); background: var(--field); display: grid; place-items: center; font: 700 46px Andika, sans-serif; position: relative; }
.lbox.done { border-style: solid; border-color: var(--good); background: var(--good-bg); color: #fff; }
.lbox.cur { border-style: solid; border-color: #F59E0B; animation: pulse 1.4s ease-in-out infinite; }
.lbox.typed { border-style: solid; border-color: var(--study); background: var(--surface-2); color: #fff; }
.lbox.sp { width: 26px; border: 0; background: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(245, 158, 11, .25); } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 76px; }
.chunks { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.chunk { display: flex; gap: 4px; padding: 5px; border-radius: 16px; border: 2px dashed var(--line); }
.chunk.t { border: 3px solid var(--part); background: var(--part-bg); }
.chunk.now { border: 3px solid #F59E0B; box-shadow: 0 0 0 5px rgba(245, 158, 11, .2); }
.lbox.given { border-style: solid; border-color: var(--line); background: var(--surface); color: var(--muted); }
.palette { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.swatch { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); cursor: pointer; touch-action: manipulation; }

.keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: 100%; max-width: 820px; }
body.inpart .app-header h1 { display: none; }
body.inpart .prog { margin: 0 auto; }
.key { height: clamp(46px, 7.4vh, 64px); border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; font: 700 32px Andika, sans-serif; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
.key:active { transform: scale(.95); }
.keys.cool .key { pointer-events: none; opacity: .55; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.opt { border: 3px solid var(--line); background: var(--surface-2); border-radius: 18px; font: 700 40px Andika, sans-serif; padding: 14px 10px; cursor: pointer; letter-spacing: 1px; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: #FCA5A5; text-decoration: line-through; }

.rw { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.rw .lbox { width: 44px; height: 50px; font-size: 34px; border-radius: 11px; }
.rw-row { display: flex; align-items: center; gap: 10px; }
.rw-row .n { font: 700 22px Fredoka, sans-serif; width: 26px; }

.sentence { font-size: 27px; line-height: 1.4; text-align: center; max-width: 30ch; }
.sentence .bad { text-decoration: underline wavy var(--bad); text-underline-offset: 7px; font-weight: 700; color: #FCA5A5; }

.ws { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; }
.grid { display: grid; gap: 4px; }
.cell { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); font: 700 26px Andika, sans-serif; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.cell.first { border-color: #F59E0B; background: var(--try-bg); }
.cell.found { color: #0E151D; border-color: transparent; }
.find { display: flex; flex-direction: column; gap: 10px; }
.find div { display: flex; align-items: center; gap: 10px; font: 700 26px Andika, sans-serif; }
.find i { width: 26px; height: 26px; border: 3px solid var(--field-line); border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 18px; }
.find .got { color: var(--good); text-decoration: line-through; }
.find .got i { border-color: var(--good); background: var(--good); color: #0E151D; }
.find button { border: 0; background: none; cursor: pointer; color: var(--muted); }

.confirm { position: fixed; inset: 0; background: rgba(5, 9, 14, .78); display: grid; place-items: center; z-index: 50; padding: 16px; }
.confirm .box { background: var(--surface); border: 2px solid var(--study); border-radius: 22px; padding: 22px 26px; max-width: 560px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.confirm h3 { margin: 0; font: 700 28px Fredoka, sans-serif; }
.confirm p { margin: 0; color: var(--muted); font-size: 18px; }

.grade { display: flex; align-items: center; gap: 18px; justify-content: center; }
.grade .letter { width: 110px; height: 110px; border-radius: 26px; display: grid; place-items: center; font: 700 72px Fredoka, sans-serif; color: #0E151D; }
.grade .pct { font: 700 46px Fredoka, sans-serif; line-height: 1; }
.grade .pct small { display: block; font: 600 18px Fredoka, sans-serif; color: var(--muted); margin-top: 6px; }
.grade-msg { font: 600 22px Fredoka, sans-serif; text-align: center; max-width: 32ch; margin: 0; }
.sumlist { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
.sum { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; font-size: 18px; }
.sum b { font-family: Fredoka, sans-serif; }
.res { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 16px; }
.res .mark { font: 700 28px Fredoka, sans-serif; width: 34px; text-align: center; }
.res.ok { border-color: var(--good); } .res.ok .mark { color: var(--good); }
.res.no { border-color: var(--try); } .res.no .mark { color: var(--try); }
.res .w { font: 700 28px Andika, sans-serif; }
.res .his { font-size: 16px; color: var(--muted); } .res .his s { color: #FCA5A5; }
.note { font-size: 14px; color: var(--muted); text-align: center; max-width: 46ch; line-height: 1.4; }
.grownup { font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; position: relative; padding: 6px 4px; }
.grownup::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--try); }
.grownup.holding::after { width: 100%; transition: width 2s linear; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 2.6s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (max-width: 640px) {
  .lbox { width: 42px; height: 56px; font-size: 34px; }
  .keys { gap: 6px; grid-template-columns: repeat(7, 1fr); } .key { font-size: 26px; }
  body.inpart .app-header h1 { display: block; }
  .opt { font-size: 30px; }
  .cell { width: 34px; height: 34px; font-size: 20px; }
  .sentence { font-size: 24px; }
  .prog { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

body.kid #tod-nav .tod-links { display: none !important; }

.ph-btn { margin-top: 18px; }
.ph-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(5,9,14,.85); display: grid; place-items: center; padding: 16px; overflow: auto; }
.ph-box { background: #131C26; border: 2px solid #FBBF24; border-radius: 22px; padding: 20px 24px; max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; color: #E5E7EB; }
.ph-box h3 { margin: 0; font: 700 26px Fredoka, sans-serif; color: #FDE68A; } .ph-box h4 { margin: 8px 0 0; font: 600 17px Fredoka, sans-serif; } .ph-box p { margin: 0; }
.ph-word { font: 700 56px Andika, sans-serif; background: #fff; color: #1F2937; border-radius: 18px; padding: 4px 30px; }
.ph-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.ph-in { font: 500 20px Andika, sans-serif; padding: 10px 14px; border-radius: 12px; border: 2px solid #334155; background: #0B1118; color: #fff; width: 230px; }
.ph-msg { min-height: 1.3em; font-weight: 600; }
.pin-wrap { position: fixed; inset: 0; z-index: 95; background: rgba(5,9,14,.88); display: grid; place-items: center; padding: 16px; }
.pin-box { background: #131C26; border: 2px solid #FBBF24; border-radius: 22px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #E5E7EB; }
.pin-box h3 { margin: 0; font: 700 24px Fredoka, sans-serif; color: #FDE68A; } .pin-msg { margin: 0; min-height: 1.2em; color: #FCA5A5; font-weight: 600; }
.pin-dots { display: flex; gap: 14px; } .pin-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FDE68A; } .pin-dots span.on { background: #FDE68A; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; } .pin-pad button { height: 64px; border-radius: 16px; border: 2px solid #334155; background: #1E293B; color: #fff; font: 700 26px Fredoka, sans-serif; cursor: pointer; } .pin-pad .pin-sm { font-size: 16px; }
.pin-box.shake { animation: pinshake .3s; } @keyframes pinshake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.skip-part { position: fixed; left: 14px; bottom: 14px; z-index: 70; display: none; font: 600 15px Fredoka, sans-serif; background: #33270C; color: #FBBF24; border: 2px solid #FBBF24; border-radius: 999px; padding: 8px 16px; cursor: pointer; } body.inpart .skip-part { display: block; }
.wl-wrap { width: 100%; max-width: 760px; margin: 8px auto 0; } .wl { width: 100%; height: 190px; border-radius: 16px; background: #fff; touch-action: none; display: block; } .wl-done { width: 360px; max-width: 100%; border-radius: 12px; background: #fff; display: block; margin: 8px auto; }
</style>

/* ---------- 1. Pick the Right One: tap the correct spelling (his own mistake is one of the choices) ---------- */
function partPick() {
  let i = 0; score.pick = { first: 0, of: WORDS.length, misses: 0 };
  const show = () => {
    const { w, his } = WORDS[i];
    const wrong = [...new Set([his, ...misspellings(w.toLowerCase())].filter(x => x && x.toLowerCase() !== w.toLowerCase()))].slice(0, 3);
    const opts = shuffle([w, ...wrong], seed + i * 3);
    let missed = false; const tapped = [];
    app.innerHTML = title('Listen, then tap the word that is spelled right.') + `<div class="count">Word ${i + 1} of ${WORDS.length}</div>
      <button class="btn big primary" id="hear">${SPK}Hear the word</button>
      <div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="message" id="msg"></div>`;
    $('hear').onclick = () => playWord(w);
    playWord(w);
    app.querySelector('.opts').onclick = e => {

      tapped.push(b.dataset.o);

        b.classList.add('right'); app.querySelectorAll('.opt').forEach(x => x.disabled = true);
        if (!missed) score.pick.first++;

        say('Yes!', 1); nextUp(1200).then(() => { i++; i < WORDS.length ? show() : partDone(`You picked ${score.pick.first} of ${WORDS.length} right on the first try.`); });
      } else {

        setMsg('Not that one. Look closely and try again.', 'try'); shakeEl(b);
      }

}

/* ---------- 2. Chunk It: every chunk, in a random order. Listen to the chunk, then type just that chunk (tricky parts are purple) ---------- */
function partChunk() {
  let i = 0; score.chunk = { mistakes: 0 };
  const show = () => {
    const { w } = WORDS[i], dw = displayWord(w), chunks = chunksFor(dw);
    let targets = chunks.map((g, k) => g.s.trim() ? k : -1).filter(k => k >= 0);   // all of them
    for (let a = targets.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [targets[a], targets[b]] = [targets[b], targets[a]]; }
    if (targets.length > 1 && targets.every((k, n) => n === 0 || k > targets[n - 1])) targets.push(targets.shift());   // never in the usual order
    const { tip } = trickyFor(w.toLowerCase());
    let ti = 0, pos = 0, heard = false; const keys = [];
    const part = () => ti < targets.length ? chunks[targets[ti]].s.replace(/ /g, '') : '';
    const draw = () => {
      $('chunks').innerHTML = chunks.map((g, k) => {
        const cur = targets[ti] === k, done = targets.indexOf(k) < ti && targets.includes(k), cls = `chunk${g.t ? ' t' : ''}${cur ? ' now' : ''}`;
        if (!targets.includes(k)) return `<div class="${cls}">${[...g.s].map(() => '<span class="lbox sp"></span>').join('')}</div>`;
        if (done) return `<div class="${cls}">${[...g.s].map(ch => `<span class="lbox done">${esc(ch)}</span>`).join('')}</div>`;
        if (cur && !heard) return `<div class="${cls}">${[...g.s].map(ch => `<span class="lbox typed">${esc(ch)}</span>`).join('')}</div>`;   // look at it while listening
        return `<div class="${cls}">${[...g.s].map((ch, n) => `<span class="lbox${cur && n < pos ? ' done' : cur && n === pos ? ' cur' : ''}">${cur && n < pos ? esc(ch) : ''}</span>`).join('')}</div>`;
      }).join('');
      $('keys').classList.toggle('cool', !heard);
      $('hearPart').classList.toggle('primary', !heard);
    };
    app.innerHTML = title('Listen to the glowing part. Then type just that part. Every part, in a mixed-up order!') + `<div class="count">Word ${i + 1} of ${WORDS.length}${tip ? ` · Tricky part: ${esc(tip)}` : ''}</div>
      <div class="row"><button class="btn big primary" id="hearPart">${SPK}Hear this part</button><button class="btn" id="hear">${SPK}Hear the word</button></div>
      <div class="chunks" id="chunks"></div>
      <div class="message" id="msg"></div>${keysHtml()}`;
    const hearPart = () => {
      const p = part(); if (!p) return playWord(w);   // already finished this word
      return say(`This part is spelled ${[...p].map(letterName).join(', ')}.`, 0.8);   // just the part (the tricky-part tip stays on the screen; "Hear the word" says the word)
    };
    $('hear').onclick = () => playWord(w);
    $('hearPart').onclick = () => hearPart().then(() => { if (!heard) { heard = true; pos = 0; draw(); setMsg('Now type that part.'); } });
    draw(); playWord(w).then(() => setMsg('Tap “Hear this part” first.'));
    onKey = (c) => {
      if (!heard) { setMsg('Tap “Hear this part” first.', 'try'); shakeEl($('hearPart')); return; }
      const p = part(); keys.push(c);
      if (c === p[pos].toLowerCase()) {
        pos++;
        if (pos >= p.length) {
          ti++; pos = 0;
          if (ti >= targets.length) { note('Chunk It', w, keys.length === chunks.map(g => g.s.replace(/ /g, '')).join('').length, w, { text: `Parts in this order: ${targets.map(k => chunks[k].s).join(' → ')}` }, [keys.join(' ')]); onKey = null; draw(); $('keys').classList.remove('cool'); setMsg('You got every part!', 'good'); say(dw, 0.85); nextUp(1300).then(() => { i++; i < WORDS.length ? show() : partDone(score.chunk.mistakes ? `Only ${score.chunk.mistakes} wrong letter${score.chunk.mistakes > 1 ? 's' : ''}. Nice work!` : 'Every letter right!'); }); return; }
          heard = false; setMsg('Great! Now listen to the next part.', 'good');
        } else setMsg('');
        draw();
      } else { score.chunk.mistakes++; shakeEl(document.querySelector('#chunks .cur')); setMsg('Listen again. Which letter comes next?', 'try'); cool(); }
    };
  };
  show();
}

/* ---------- 3. Rainbow Write: pick a color for each line. Type it twice looking at it, then once from memory (the word and the other lines disappear) ---------- */

  let i = 0; score.rainbow = { clean: 0, of: WORDS.length * 3 };

      $('rw').innerHTML = rows.map(r => `<div class="rw-row"><span class="n" style="color:${cols[r] || 'var(--muted)'}">${r + 1}</span>${letters.map((ch, n) => {
        const done = r < row || (r === row && n < pos);
        return `<span class="lbox${done ? ' done' : r === row && n === pos && cols[r] ? ' cur' : ''}" style="${done ? `border-color:${cols[r]};color:${cols[r]};background:var(--surface-2)` : ''}">${done ? esc(ch) : ''}</span>`;
      }).join('')}</div>`).join('');
      $('wordShow').innerHTML = row < 2 ? `<div class="big-word">${esc(dw)}</div>` : `<div class="hidden-word">Now from memory!</div>`;
      const picking = row <= 2 && !cols[row];
      $('pal').innerHTML = picking ? `<div class="count">Pick a color for line ${row + 1}</div><div class="palette">${PALETTE.map(([c, name]) => `<button class="swatch" data-c="${c}" style="background:${c}" aria-label="${name}"></button>`).join('')}</div>` : '';
      $('keys').classList.toggle('cool', picking);
    };
    app.innerHTML = title('Pick a color, then type the word. 2 lines looking, 1 from memory, then write it with your pencil!') + `<div class="count">Word ${i + 1} of ${WORDS.length}</div>
      <div id="wordShow"></div>
      <div class="row"><button class="btn" id="hear">${SPK}Hear the word</button></div>
      <div id="pal"></div><div class="rw" id="rw"></div><div class="message" id="msg"></div>${keysHtml()}
      <div class="row acts" id="memActs" hidden><button class="btn big" id="backBtn">⌫ Back</button><button class="btn big primary" id="doneBtn" disabled>Done ✓</button></div>`;
    $('hear').onclick = () => playWord(w);
    const finish = () => writeLine();
    /* Line 4: he writes the word himself with his pencil or finger, no guide letters (the word is shown), to practice the motion */
    const writeLine = () => {
      onKey = null; $('memActs').hidden = true; $('keys').hidden = true;
      $('wordShow').innerHTML = `<div class="big-word">${esc(dw)}</div>`;
      $('rw').innerHTML = [0, 1, 2].map(r => `<div class="rw-row"><span class="n" style="color:${cols[r]}">${r + 1}</span>${letters.map(ch => `<span class="lbox done" style="border-color:${cols[r]};color:${cols[r]};background:var(--surface-2)">${esc(ch)}</span>`).join('')}</div>`).join('');
      const PAL = [['#F87171', 'red'], ['#FB923C', 'orange'], ['#FBBF24', 'yellow'], ['#34D399', 'green'], ['#38BDF8', 'light blue'], ['#7FB0F0', 'blue'], ['#C4B5FD', 'purple'], ['#F9A8D4', 'pink']];
      $('pal').innerHTML = `<div class="count">Line 4: pick a color, then write “${esc(dw)}” with your pencil or finger</div><div class="palette">${PAL.map(([c, name]) => `<button class="swatch" data-c4="${c}" style="background:${c}" aria-label="${name}"></button>`).join('')}</div>
        <div class="wl-wrap" id="wlWrap" hidden><canvas id="wl" class="wl"></canvas><div class="row acts"><button class="btn big" id="wlUndo">↶ Undo</button><button class="btn big" id="wlClear">↺ Start over</button><button class="btn big primary" id="wlDone">Done ✓</button></div></div>`;
      setMsg('Last line: write it yourself, no dotted letters this time!', 'good'); say('Last line! Write the word yourself with your pencil.', 0.95);
      let col = null, usedPen = false, penId = null, cur = null, strokes = [], caseAsked = '', flagged = null, caseFlags = null;
      $('pal').onclick = e => { const b = e.target.closest('[data-c4]'); if (!b) return; col = b.dataset.c4; $('wlWrap').hidden = false; setup(); };
      const setup = () => {
        const cv = $('wl'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
        const g = cv.getContext('2d'); g.scale(dpr, dpr);
        const drawAll = () => {
          g.clearRect(0, 0, r.width, r.height); g.fillStyle = '#fff'; g.fillRect(0, 0, r.width, r.height);
          const top = r.height * 0.18, mid = r.height * 0.5, base = r.height * 0.82;
          if (flagged) { g.fillStyle = 'rgba(251,146,60,.3)'; flagged.forEach(f => g.fillRect(f.x0 - 6, top - 8, f.x1 - f.x0 + 12, base - top + 16)); }
          g.strokeStyle = '#93C5FD'; g.lineWidth = 2; g.setLineDash([]); [top, base].forEach(y => { g.beginPath(); g.moveTo(10, y); g.lineTo(r.width - 10, y); g.stroke(); });
          g.setLineDash([10, 8]); g.beginPath(); g.moveTo(10, mid); g.lineTo(r.width - 10, mid); g.stroke(); g.setLineDash([]);
          g.strokeStyle = col; g.lineWidth = 7; g.lineCap = g.lineJoin = 'round';
          strokes.forEach(s => { g.beginPath(); s.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); if (s.length === 1) g.lineTo(s[0][0] + 0.1, s[0][1]); g.stroke(); });

        cv.onpointerdown = e => { e.preventDefault(); if (e.pointerType === 'pen') usedPen = true; if ((usedPen && e.pointerType === 'touch') || (cur && penId !== e.pointerId)) return; penId = e.pointerId; cur = [pt(e)]; strokes.push(cur); caseAsked = ''; flagged = null; try { cv.setPointerCapture(e.pointerId); } catch (er) { } drawAll(); };
        cv.onpointermove = e => { if (!cur || e.pointerId !== penId) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (evs.length ? evs : [e]).forEach(ev => cur.push(pt(ev))); drawAll(); };

        $('wlClear').onclick = () => { strokes = []; caseAsked = ''; flagged = null; drawAll(); };

        $('wlDone').onclick = () => {
          const xs = strokes.flat().map(p => p[0]), span = xs.length ? Math.max(...xs) - Math.min(...xs) : 0, ink = strokes.reduce((a, s) => a + s.length, 0);
          if (strokes.length < Math.min(letters.length, 3) || ink < 20 * letters.length || span < r.width * 0.25) { setMsg('Write the whole word, every letter. Take your time!', 'try'); say('Write the whole word. Take your time.', 0.95); return; }
          if (typeof hcCheck === 'function') {   // capital or small letters (Done again = "it's right")
            const flags = hcCheck([{ top: r.height * 0.18, mid: r.height * 0.5, base: r.height * 0.82, pts: hcDense(strokes) }], dw), key = flags.map(f => f.ch + Math.round(f.x0)).join();
            if (flags.length && caseAsked !== key) { caseAsked = key; flagged = flags; drawAll(); const m = hcMessage(flags); setMsg(`${m} Fix it with ↶ Undo, or tap Done again if it’s right.`, 'try'); say(m, 0.95); return; }
            caseFlags = flags.length ? flags.map(f => `${f.ch} (${f.want === 'small' ? 'looked like a capital' : 'looked small'})`) : null;
            flagged = null; drawAll();
          }
          let img = ''; try { const sm = document.createElement('canvas'); sm.width = 360; sm.height = Math.round(360 * cv.height / cv.width); sm.getContext('2d').drawImage(cv, 0, 0, sm.width, sm.height); img = sm.toDataURL('image/png'); } catch (er) { }
          $('pal').innerHTML = img ? `<img class="wl-done" src="${img}" alt="What he wrote">` : ''; $('keys').hidden = false;
          finishAll(img);
        };
        drawAll();
      };
    };
    const finishAll = img => {
      note('Rainbow Write', w, lineKeys[0].length === letters.length && lineKeys[1].length === letters.length && memTries.length === 1, w, { text: 'Lines 1 and 2 looking at the word, line 3 from memory (he typed the whole word, then double-checked it), line 4 written by hand.' + (caseFlags ? ` The capital-letter check asked about ${caseFlags.join(', ')} on line 4, and he kept it.` : ''), img: img || undefined }, [`line 1: ${lineKeys[0].join(' ')}`, `line 2: ${lineKeys[1].join(' ')}`, ...memTries.map((s, k) => `line 3${memTries.length > 1 ? `, try ${k + 1}` : ''}: ${s}`)]);
      onKey = null; $('memActs').hidden = true; $('wordShow').innerHTML = `<div class="big-word">${esc(dw)}</div>`;
      $('rw').innerHTML = [0, 1, 2].map(r => `<div class="rw-row"><span class="n" style="color:${cols[r]}">${r + 1}</span>${letters.map(ch => `<span class="lbox done" style="border-color:${cols[r]};color:${cols[r]};background:var(--surface-2)">${esc(ch)}</span>`).join('')}</div>`).join('');
      setMsg('Rainbow done!', 'good'); say(dw, 0.85); nextUp(1500).then(() => { i++; i < WORDS.length ? show() : partDone(`${score.rainbow.clean} of ${score.rainbow.of} written with no mistakes (the last one from memory).`); });
    };
    $('backBtn').onclick = () => { memTyped = memTyped.slice(0, -1); draw(); };
    $('doneBtn').onclick = () => {
      if (!memTyped) return;
      $('confirmWord').innerHTML = [...memTyped].map(c => `<span class="lbox typed">${esc(c)}</span>`).join('');
      $('confirm').hidden = false; doubleCheck();
      $('confirmNo').onclick = () => { $('confirm').hidden = true; setMsg('Fix any letter that’s wrong, then tap Done.'); };
      $('confirmYes').onclick = () => {
        $('confirm').hidden = true; memTries.push(memTyped);

        setMsg('Not quite. Look at the word carefully. It will hide again!', 'try'); say('Not quite. Look at the word carefully.', 0.95);
        setTimeout(() => { memShow = false; if (row === 2) { draw(); setMsg('Now type it from memory again.'); } }, 3500);

    };

    draw(); playWord(w);

  };
  show();

/* ---------- 4. Oops! Fix the Sentence: his own misspelling is in the sentence; he types it the right way ---------- */
function partFix() {
  let i = 0; score.fix = { first: 0, of: WORDS.length };
  const show = () => {
    const { w, his } = WORDS[i], dw = displayWord(w);
    const bad = his && his.toLowerCase() !== w.toLowerCase() ? his : (misspellings(w.toLowerCase())[0] || w + 'e');
    const s = sentenceFor(w) || 'Can you spell the word ___ the right way?';   // never just the word by itself
    const sent = s ? esc(s).replace('___', `<span class="bad">${esc(bad)}</span>`) : `<span class="bad">${esc(bad)}</span>`;
    let typed = '', tries = 0; const tried = [];
    const draw = () => { $('ans').innerHTML = [...typed].map(c => `<span class="lbox typed">${esc(c)}</span>`).join('') + '<span class="lbox cur"></span>'; $('doneBtn').disabled = !typed; };
    app.innerHTML = title('One word is spelled wrong. Type it the right way.') + `<div class="count">Sentence ${i + 1} of ${WORDS.length}</div>
      <div class="sentence">${sent}</div>
      <div class="row"><button class="btn" id="hear">${SPK}Hear the sentence</button></div>
      <div class="boxes" id="ans"></div><div class="message" id="msg"></div>${keysHtml()}
      <div class="row acts"><button class="btn big" id="backBtn">⌫ Back</button><button class="btn big primary" id="doneBtn" disabled>Check ✓</button></div>`;
    const hear = () => s ? say(s.replace('___', w), 0.85) : playWord(w);
    $('hear').onclick = hear; hear();
    draw();
    onKey = c => { if (typed.length < 20) { typed += c; draw(); } };
    $('backBtn').onclick = () => { typed = typed.slice(0, -1); draw(); };
    $('doneBtn').onclick = () => {
      tried.push(typed);
      if (typed.toLowerCase() === w.toLowerCase().replace(/\s+/g, '')) {
        note('Fix the Sentence', w, !tries, w, { text: s ? s.replace('___', bad) : bad }, tried);
        if (!tries) score.fix.first++;
        onKey = null; setMsg('Fixed it!', 'good');
        $('ans').innerHTML = [...dw].map(c => c === ' ' ? '<span class="lbox sp"></span>' : `<span class="lbox done">${esc(c)}</span>`).join('');
        say('Fixed it!', 1); nextUp(1200).then(() => { i++; i < WORDS.length ? show() : partDone(`You fixed ${score.fix.first} of ${WORDS.length} on the first try.`); });
      } else {
        tries++; typed = ''; draw(); shakeEl($('ans'));
        if (tries >= 2) { setMsg(`It’s spelled: ${[...dw].join(' ')}. Now you type it.`, 'try'); say(`It's spelled ${[...dw.replace(/\s+/g, '')].map(letterName).join(', ')}.`, 0.75); }
        else { setMsg('Not quite. Think about the tricky part and try again.', 'try'); }
      }
    };
  };
  show();
}

/* ---------- 5. Word Search: tap the first letter, then the last letter ---------- */
function partSearch() {
  const targets = WORDS.map(x => x.w.toLowerCase().replace(/[^a-z]/g, '')).filter(Boolean);
  const ws = wordSearch(targets, seed + 3);
  if (!ws) return nextPart();
  const { N, grid } = ws, found = new Map(), FOUND_COLORS = ['#34D399', '#7FB0F0', '#FBBF24', '#C4B5FD', '#F9A8D4', '#FDBA74'];
  score.search = { found: 0, of: targets.length, wrongTaps: 0 };
  let first = null;
  const draw = () => {
    const color = {};
    [...found.entries()].forEach(([w, cells], k) => cells.forEach(c => color[c] = FOUND_COLORS[targets.indexOf(w) % FOUND_COLORS.length]));
    $('grid').innerHTML = grid.flat().map((ch, n) => `<button class="cell${color[n] ? ' found' : ''}${first === n ? ' first' : ''}" data-n="${n}" style="${color[n] ? `background:${color[n]}` : ''}" aria-label="${ch}">${ch}</button>`).join('');
    $('find').innerHTML = targets.map(w => `<div class="${found.has(w) ? 'got' : ''}"><i>${found.has(w) ? '✓' : ''}</i>${esc(w)}<button data-say="${esc(w)}" aria-label="Hear ${esc(w)}">${SPK}</button></div>`).join('');
  };
  app.innerHTML = title('Find each word. Tap its first letter, then its last letter. Words go across → or down ↓.') +
    `<div class="ws"><div class="grid" id="grid" style="grid-template-columns:repeat(${N},auto)"></div><div class="find" id="find"></div></div><div class="message" id="msg"></div>`;
  draw();
  $('find').onclick = e => { const b = e.target.closest('[data-say]'); if (b) playWord(b.dataset.say); };
  $('grid').onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const n = +b.dataset.n;
    if (first === null) { first = n; draw(); setMsg('Now tap the last letter of the word.'); return; }
    if (n === first) { first = null; draw(); setMsg(''); return; }
    const r1 = Math.floor(first / N), c1 = first % N, r2 = Math.floor(n / N), c2 = n % N;
    let cells = [];
    if (r1 === r2 && c2 > c1) for (let c = c1; c <= c2; c++) cells.push(r1 * N + c);
    else if (c1 === c2 && r2 > r1) for (let r = r1; r <= r2; r++) cells.push(r * N + c1);
    const str = cells.map(x => grid[Math.floor(x / N)][x % N]).join('');
    const hit = targets.find(w => w === str && !found.has(w));
    first = null;
    if (hit) {
      found.set(hit, cells); score.search.found = found.size; draw();
      setMsg(`You found “${hit}”!`, 'good'); playWord(hit);
      if (found.size === targets.length) setTimeout(() => partDone(score.search.wrongTaps ? `You found all ${targets.length}!` : `You found all ${targets.length} with no wrong taps!`), 1200);
    } else { score.search.wrongTaps++; draw(); setMsg('That’s not one of the words. Try again!', 'try'); }
  };
  say('Find each word. Tap its first letter, then its last letter.', 0.95);
}

/* ---------- 6. Practice Test: the words are hidden; he hears each one and spells it. Are you sure? Then a grade. ---------- */
function partTest() {
  const order = shuffle(WORDS.map(x => x.w), seed + 9);
  if (order.length > 2 && order.every((w, k) => w === WORDS[k].w)) order.push(order.shift());
  let i = 0, typed = ''; score.test = [];
  app.innerHTML = title('Time for the test! I’ll say each word. Spell it all by yourself.') +
    `<button class="btn big primary" id="start">Start the test</button>`;
  say('Time for the practice test! I’ll say each word. Spell it all by yourself.', 0.95);
  $('start').onclick = () => show();
  const draw = () => { $('ans').innerHTML = [...typed].map(c => c === ' ' ? '<span class="lbox sp"></span>' : `<span class="lbox typed">${esc(c)}</span>`).join('') + '<span class="lbox cur"></span>'; $('doneBtn').disabled = !typed.trim(); };
  const show = () => {
    typed = '';
    app.innerHTML = title('Listen, then spell the word. No peeking, no help!') + `<div class="count">Word ${i + 1} of ${order.length}</div>
      <div class="row"><button class="btn big primary" id="hear">${SPK}Hear the word</button><button class="btn big" id="hearS">${SPK}Hear it in a sentence</button></div>
      <div class="boxes" id="ans"></div>${keysHtml()}
      <div class="row acts">${order.some(w => w.includes(' ')) ? '<button class="btn big" id="spaceBtn">space</button>' : ''}<button class="btn big" id="backBtn">⌫ Back</button><button class="btn big primary" id="doneBtn" disabled>Done ✓</button></div>${phButton()}`;
    const w = order[i];
    wireParentHelp(() => w);
    $('hear').onclick = () => playWord(w);
    $('hearS').onclick = () => sayWordAndSentence(w);
    sayWordAndSentence(w); draw();
    onKey = c => { if ($('confirm').hidden && typed.length < 24) { typed += c; draw(); } };
    if ($('spaceBtn')) $('spaceBtn').onclick = () => { if (typed && !typed.endsWith(' ')) { typed += ' '; draw(); } };
    $('backBtn').onclick = () => { typed = typed.slice(0, -1); draw(); };
    $('doneBtn').onclick = () => {
      $('confirmWord').innerHTML = [...typed.trim()].map(c => c === ' ' ? '<span class="lbox sp"></span>' : `<span class="lbox typed">${esc(c)}</span>`).join('');
      $('confirm').hidden = false; doubleCheck(); $('confirmNo').focus();
    };
  };
  $('confirmNo').onclick = () => { $('confirm').hidden = true; };
  $('confirmYes').onclick = () => {
    $('confirm').hidden = true;
    const w = order[i];
    score.test.push({ word: w, typed: typed.trim(), ok: typed.trim().toLowerCase().replace(/\s+/g, ' ') === w.toLowerCase() });
    note('Practice Test', w, score.test.at(-1).ok, w, { text: 'He only heard the word and a sentence (the word was hidden).' }, [typed.trim()]);
    onKey = null; i++;
    if (i < order.length) { app.querySelector('.count').textContent = 'Got it!'; nextUp(1000, 'Next word coming…').then(show); }
    else showResults();
  };
}

/* ============ Results: grade for the Practice Test, how each part went, and the email ============ */
function gradeFor(right, n) {
  const pct = n ? Math.round(right / n * 100) : 0;
  const letter = pct >= 90 ? 'A' : pct >= 80 ? 'B' : pct >= 70 ? 'C' : pct >= 60 ? 'D' : 'F';
  const color = { A: '#34D399', B: '#7FB0F0', C: '#FBBF24', D: '#FB923C', F: '#F87171' }[letter];
  const msg = {
    A: pct === 100 ? 'Perfect! Your practice and hard work paid off!' : 'Amazing work! Your practice is paying off!',
    B: 'Great job! A little more practice and you’ll get them all.',
    C: 'Good try! Practice the tricky ones and take your time next time.',
    D: 'Keep practicing! Slow down, listen carefully, and try your best.',
    F: 'These are hard. Practice every day, take your time, and try your best. You can do it!'
  }[letter];
  return { pct, letter, color, msg };
}
const shortDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
function partLines() {
  const s = score;
  return [
    ['Pick the Right One', `${s.pick.first} of ${s.pick.of} right on the first try`],
    ['Chunk It (tricky part)', s.chunk.mistakes ? `${s.chunk.mistakes} wrong letter${s.chunk.mistakes > 1 ? 's' : ''}` : 'no wrong letters'],
    ['Rainbow Write', `${s.rainbow.clean} of ${s.rainbow.of} with no mistakes (last one from memory)`],
    ['Fix the Sentence', `${s.fix.first} of ${s.fix.of} fixed on the first try`],
    ['Word Search', `found ${s.search.found} of ${s.search.of}${s.search.wrongTaps ? `, ${s.search.wrongTaps} wrong tap${s.search.wrongTaps > 1 ? 's' : ''}` : ''}`]
  ];
}

function emailBody(rec) {
  const right = rec.test.filter(r => r.ok).length, n = rec.test.length;
  const body = {
    _subject: `Spelling Fix-Up: Practice Test ${rec.grade.pct}% ${rec.grade.letter}, ${right} of ${n} right (${shortDate(rec.t)})`,
    _template: 'table', _captcha: 'false',
    'Date': new Date(rec.t).toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    'Words': rec.words.map(x => x.w).join(', '),
    'From': rec.from,
    'Practice Test grade': `${rec.grade.pct}% (${rec.grade.letter}), ${right} of ${n} right`
  };
  rec.test.forEach((r, i) => { body[`Test ${i + 1}. ${r.word}`] = r.ok ? 'right' : `wrong: he wrote "${r.typed}"`; });
  rec.parts.forEach(([k, v]) => { body[k] = v; });
  const still = rec.test.filter(r => !r.ok).map(r => r.word);
  body['Still tricky'] = still.length ? still.join(', ') : 'None! He got them all on the practice test.';
  body['Parent Review (recordings + results)'] = location.origin + location.pathname.replace(/[^/]*$/, '') + 'spell.html#review   (open it on the device he used)';
  return body;
}
let sending = false;
async function sendOutbox() {
  if (sending) return; sending = true;
  try {
    let box = store('fixup-outbox') || [];
    for (const rec of [...box]) {
      try {
        if (!(await postForm(rec.body || emailBody(rec)))) break;
        box = box.filter(x => x.id !== rec.id); store('fixup-outbox', box);
        const l = store('fixup-latest'); if (l && l.id === rec.id) { l.sent = true; store('fixup-latest', l); }
      } catch (e) { break; }
    }
  } finally { sending = false; }
}

/* ============ Grown-up PIN: on his device, every grown-up button asks for it after the hold (set on the grown-up's Daily Sight Words card).
   Stored as a hash in Study settings (his device can read but not change it). 3 wrong tries = locked for a minute. ============ */
async function pinHash(pin) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tod-study-pin:' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const pinSet = () => { try { return (JSON.parse(localStorage.getItem('spell-settings') || '{}') || {}).pin || ''; } catch (e) { return ''; } };
const PIN_ROLE = () => { try { return localStorage.getItem('study-role') || ''; } catch (e) { return ''; } };
function askPin() {
  if (!pinSet() || PIN_ROLE() !== 'kid') return Promise.resolve(true);   // no PIN yet, or a grown-up's own device
  return new Promise(res => {
    let typed = '';
    const w = document.createElement('div'); w.className = 'pin-wrap'; w.setAttribute('role', 'dialog');
    w.innerHTML = `<div class="pin-box"><h3>🔒 Grown-up PIN</h3><div class="pin-dots"></div><p class="pin-msg"></p>
      <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-x="cancel" class="pin-sm">Cancel</button><button data-n="0">0</button><button data-x="back" class="pin-sm">⌫</button></div></div>`;
    document.body.appendChild(w);
    const q = s => w.querySelector(s), lockUntil = () => +(sessionStorage.getItem('study-pin-lock') || 0);
    const draw = () => { q('.pin-dots').innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < typed.length ? 'on' : ''}"></span>`).join(''); };
    const done = ok => { window.removeEventListener('keydown', onKey, true); w.remove(); res(ok); };
    const locked = () => { const s = Math.ceil((lockUntil() - Date.now()) / 1000); if (s > 0) { q('.pin-msg').textContent = `Too many tries. Wait ${s} seconds.`; return true; } return false; };
    const press = async n => {
      if (locked() || typed.length >= 4) return;
      typed += n; draw();
      if (typed.length < 4) return;
      if (await pinHash(typed) === pinSet()) { sessionStorage.removeItem('study-pin-bad'); return done(true); }
      const bad = +(sessionStorage.getItem('study-pin-bad') || 0) + 1; sessionStorage.setItem('study-pin-bad', bad);
      if (bad >= 3) { sessionStorage.setItem('study-pin-lock', Date.now() + 60000); sessionStorage.setItem('study-pin-bad', 0); }
      typed = ''; q('.pin-box').classList.remove('shake'); void q('.pin-box').offsetWidth; q('.pin-box').classList.add('shake');
      setTimeout(draw, 300); if (!locked()) q('.pin-msg').textContent = 'That’s not it. Try again.';
    };
    const onKey = e => { e.stopImmediatePropagation(); e.preventDefault(); if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') { typed = typed.slice(0, -1); draw(); } else if (e.key === 'Escape') done(false); };
    window.addEventListener('keydown', onKey, true);
    w.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.n) press(b.dataset.n); else if (b.dataset.x === 'back') { typed = typed.slice(0, -1); draw(); } else done(false); });
    draw(); locked();
  });
}
function holdButton(el, ms, fn) {
  let t = null; const cancel = () => { clearTimeout(t); el.classList.remove('holding'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('holding'); t = setTimeout(() => { cancel(); askPin().then(ok => ok && fn()); }, ms); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

  app.innerHTML = `<div class="part-title"><h2>No words to fix yet</h2><p>This page uses the words he missed on the daily sight word check.</p></div><a class="btn big primary" href="spell.html" style="text-decoration:none">Go to the Spelling Helper</a>`;
} else {
  app.innerHTML = `<div class="part-title"><h2>Let’s fix ${WORDS.length === 1 ? 'this word' : `these ${WORDS.length} words`}!</h2><p>Six fun parts, then a practice test. Take your time and try your best.</p></div>
    <div class="row">${WORDS.map(x => `<span class="big-word" style="font-size:36px;padding:4px 18px">${esc(displayWord(x.w))}</span>`).join('')}</div>
    <button class="btn big primary" id="begin">Let’s go →</button>`;
  $('begin').onclick = () => startPart(0);
  renderProg();
}
if (emailOn() && (store('fixup-outbox') || []).length) sendOutbox();
</script>
<script src="/nav.js" defer></script>
</body>
</html>
