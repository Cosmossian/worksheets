<style>
/* On-screen worksheets: the printed Study worksheets (worksheets/index.html), done on the computer.
   Same dark look as the Spelling Helper and the on-screen Fix-Up. One thing on screen at a time, big targets. */
:root { color-scheme: dark; --navy: #8DB8F2; --ink: #E5ECF4; --muted: #9AABBF; --line: #2B3A4D; --bg: #0E151D; --accent: #7FB0F0;
  --study: #3C7DD9; --surface: #16202B; --surface-2: #1C2836; --field: #0F1822; --field-line: #3A4B60;
  --good: #34D399; --good-bg: #0F2E25; --try: #FBBF24; --try-bg: #33270C; --bad: #F87171; --bad-bg: #3A1717; --part: #C4B5FD; --part-bg: #241C3D; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: Andika, system-ui, sans-serif; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #F59E0B; outline-offset: 3px; }
[hidden] { display: none !important; }

.app-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.app-header h1 { margin: 0; font: 700 24px Fredoka, sans-serif; color: var(--navy); }
.prog { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.prog span { font: 600 14px Fredoka, sans-serif; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.prog span.now { background: var(--study); border-color: var(--study); color: #fff; }
.prog span.done { color: var(--good); border-color: var(--good); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 18px Fredoka, sans-serif; border: 2px solid var(--line); border-radius: 14px; padding: 10px 18px; min-height: 48px; cursor: pointer; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--study); border-color: var(--study); color: #fff; }
.btn.big { font-size: 22px; padding: 14px 24px; min-height: 60px; border-radius: 18px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 24px; height: 24px; flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row.acts { gap: 64px; }
.nextbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--surface); border: 2px solid var(--study); border-radius: 999px; padding: 10px 22px; display: flex; align-items: center; gap: 14px; z-index: 60; font: 600 18px Fredoka, sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.nextbar i { width: 140px; height: 12px; border-radius: 999px; background: var(--field); overflow: hidden; display: block; }
.nextbar b { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; animation: nextfill linear forwards; }
@keyframes nextfill { to { width: 100%; } }
body.advancing main button, body.advancing main .key { pointer-events: none; }

main { max-width: 980px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.part-title { text-align: center; }
.part-title h2 { margin: 0; font: 700 28px Fredoka, sans-serif; }
.part-title p { margin: 2px 0 0; color: var(--muted); font-size: 17px; }
.message { min-height: 2.8em; max-width: 720px; line-height: 1.3; text-align: center; font: 600 24px Fredoka, sans-serif; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
.message.good { color: var(--good); } .message.try { color: var(--try); }
.count { font: 600 16px Fredoka, sans-serif; color: var(--muted); }

.big-word { font: 700 clamp(40px, 7vw, 60px) Andika, sans-serif; letter-spacing: 4px; background: #fff; color: #1F2937; border-radius: 18px; padding: 2px 24px; }
.big-word .t { text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 8px; }
#eraseBtn.on { background: #FDE68A; color: #17201A; border-color: #F59E0B; } canvas.erasing { cursor: cell; }
.hidden-word { font: 700 28px Fredoka, sans-serif; padding: 10px 24px !important; color: var(--muted); border: 3px dashed var(--field-line); border-radius: 20px; padding: 16px 30px; }

.lbox { width: 58px; height: 72px; border-radius: 13px; border: 3px dashed var(--field-line); background: var(--field); display: grid; place-items: center; font: 700 46px Andika, sans-serif; position: relative; }
.lbox.done { border-style: solid; border-color: var(--good); background: var(--good-bg); color: #fff; }
.lbox.cur { border-style: solid; border-color: #F59E0B; animation: pulse 1.4s ease-in-out infinite; }
.lbox.typed { border-style: solid; border-color: var(--study); background: var(--surface-2); color: #fff; }
.lbox.sp { width: 26px; border: 0; background: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(245, 158, 11, .25); } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 76px; }
.chunks { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.chunk { display: flex; gap: 4px; padding: 5px; border-radius: 16px; border: 2px dashed var(--line); }
.chunk.t { border: 3px solid var(--part); background: var(--part-bg); }
.chunk.now { border: 3px solid #F59E0B; box-shadow: 0 0 0 5px rgba(245, 158, 11, .2); }
.lbox.given { border-style: solid; border-color: var(--line); background: var(--surface); color: var(--muted); }
.palette { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.swatch { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); cursor: pointer; touch-action: manipulation; }

.keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: 100%; max-width: 820px; }
body.inpart .app-header h1 { display: none; }
body.inpart .prog { margin: 0 auto; }
.key { height: clamp(46px, 7.4vh, 64px); border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; font: 700 32px Andika, sans-serif; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
.key:active { transform: scale(.95); }
.keys.cool .key { pointer-events: none; opacity: .55; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.opt { border: 3px solid var(--line); background: var(--surface-2); border-radius: 18px; font: 700 40px Andika, sans-serif; padding: 14px 10px; cursor: pointer; letter-spacing: 1px; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: #FCA5A5; text-decoration: line-through; }

.rw { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.rw .lbox { width: 44px; height: 50px; font-size: 34px; border-radius: 11px; }
.rw-row { display: flex; align-items: center; gap: 10px; }
.rw-row .n { font: 700 22px Fredoka, sans-serif; width: 26px; }

.sentence { font-size: 27px; line-height: 1.4; text-align: center; max-width: 30ch; }
.sentence .bad { text-decoration: underline wavy var(--bad); text-underline-offset: 7px; font-weight: 700; color: #FCA5A5; }

.ws { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; }
.grid { display: grid; gap: 4px; }
.cell { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); font: 700 26px Andika, sans-serif; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.cell.first { border-color: #F59E0B; background: var(--try-bg); }
.cell.found { color: #0E151D; border-color: transparent; }
.find { display: flex; flex-direction: column; gap: 10px; }
.find div { display: flex; align-items: center; gap: 10px; font: 700 26px Andika, sans-serif; }
.find i { width: 26px; height: 26px; border: 3px solid var(--field-line); border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 18px; }
.find .got { color: var(--good); text-decoration: line-through; }
.find .got i { border-color: var(--good); background: var(--good); color: #0E151D; }
.find button { border: 0; background: none; cursor: pointer; color: var(--muted); }

.confirm { position: fixed; inset: 0; background: rgba(5, 9, 14, .78); display: grid; place-items: center; z-index: 50; padding: 16px; }
.confirm .box { background: var(--surface); border: 2px solid var(--study); border-radius: 22px; padding: 22px 26px; max-width: 560px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.confirm h3 { margin: 0; font: 700 28px Fredoka, sans-serif; }
.confirm p { margin: 0; color: var(--muted); font-size: 18px; }

.grade { display: flex; align-items: center; gap: 18px; justify-content: center; }
.grade .letter { width: 110px; height: 110px; border-radius: 26px; display: grid; place-items: center; font: 700 72px Fredoka, sans-serif; color: #0E151D; }
.grade .pct { font: 700 46px Fredoka, sans-serif; line-height: 1; }
.grade .pct small { display: block; font: 600 18px Fredoka, sans-serif; color: var(--muted); margin-top: 6px; }
.grade-msg { font: 600 22px Fredoka, sans-serif; text-align: center; max-width: 32ch; margin: 0; }
.sumlist { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
.sum { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; font-size: 18px; }
.sum b { font-family: Fredoka, sans-serif; }
.res { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 16px; }
.res .mark { font: 700 28px Fredoka, sans-serif; width: 34px; text-align: center; }
.res.ok { border-color: var(--good); } .res.ok .mark { color: var(--good); }
.res.no { border-color: var(--try); } .res.no .mark { color: var(--try); }
.res .w { font: 700 28px Andika, sans-serif; }
.res .his { font-size: 16px; color: var(--muted); } .res .his s { color: #FCA5A5; }
.note { font-size: 14px; color: var(--muted); text-align: center; max-width: 46ch; line-height: 1.4; }
.grownup { font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; position: relative; padding: 6px 4px; }
.grownup::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--try); }
.grownup.holding::after { width: 100%; transition: width 2s linear; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 2.6s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (max-width: 640px) {
  .lbox { width: 42px; height: 56px; font-size: 34px; }
  .keys { gap: 6px; grid-template-columns: repeat(7, 1fr); } .key { font-size: 26px; }
  body.inpart .app-header h1 { display: block; }
  .opt { font-size: 30px; }
  .cell { width: 34px; height: 34px; font-size: 20px; }
  .sentence { font-size: 24px; }
  .prog { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

body.kid #tod-nav .tod-links { display: none !important; }
body.kid #tod-nav .tod-home { pointer-events: none; }

.ph-btn { margin-top: 18px; }
.ph-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(5,9,14,.85); display: grid; place-items: center; padding: 16px; overflow: auto; }
.ph-box { background: #131C26; border: 2px solid #FBBF24; border-radius: 22px; padding: 20px 24px; max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; color: #E5E7EB; }
.ph-box h3 { margin: 0; font: 700 26px Fredoka, sans-serif; color: #FDE68A; } .ph-box h4 { margin: 8px 0 0; font: 600 17px Fredoka, sans-serif; } .ph-box p { margin: 0; }
.ph-word { font: 700 56px Andika, sans-serif; background: #fff; color: #1F2937; border-radius: 18px; padding: 4px 30px; }
.ph-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.ph-in { font: 500 20px Andika, sans-serif; padding: 10px 14px; border-radius: 12px; border: 2px solid #334155; background: #0B1118; color: #fff; width: 230px; }
.ph-msg { min-height: 1.3em; font-weight: 600; }
.pin-wrap { position: fixed; inset: 0; z-index: 95; background: rgba(5,9,14,.88); display: grid; place-items: center; padding: 16px; }
.pin-box { background: #131C26; border: 2px solid #FBBF24; border-radius: 22px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #E5E7EB; }
.pin-box h3 { margin: 0; font: 700 24px Fredoka, sans-serif; color: #FDE68A; } .pin-msg { margin: 0; min-height: 1.2em; color: #FCA5A5; font-weight: 600; }
.pin-dots { display: flex; gap: 14px; } .pin-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FDE68A; } .pin-dots span.on { background: #FDE68A; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; } .pin-pad button { height: 64px; border-radius: 16px; border: 2px solid #334155; background: #1E293B; color: #fff; font: 700 26px Fredoka, sans-serif; cursor: pointer; } .pin-pad .pin-sm { font-size: 16px; }
.pin-box.shake { animation: pinshake .3s; } @keyframes pinshake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.skip-part { position: fixed; left: 14px; bottom: 14px; z-index: 70; display: none; font: 600 15px Fredoka, sans-serif; background: #33270C; color: #FBBF24; border: 2px solid #FBBF24; border-radius: 999px; padding: 8px 16px; cursor: pointer; } body.inpart .skip-part { display: block; }
.sumlist .res .mark { min-width: 40px; }
.mt-pts { font: 700 30px Fredoka, sans-serif; color: #FDE68A; } .mt-pts.neg { color: #FCA5A5; }
.nextbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--surface); border: 2px solid var(--study); border-radius: 999px; padding: 10px 22px; display: flex; align-items: center; gap: 14px; z-index: 60; font: 600 18px Fredoka, sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.nextbar i { width: 140px; height: 12px; border-radius: 999px; background: var(--field); overflow: hidden; display: block; }
.nextbar b { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; animation: nextfill linear forwards; }

.tracebox canvas { display: block; touch-action: none; cursor: crosshair; }

.qcard { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.qcard small { font: 600 15px Fredoka, sans-serif; color: var(--muted); }

/* Common letter patterns, used to find the tricky part of any other word. Checked in this order. */
const PATTERNS = [
  ['igh', 'igh says “i”'], ['tch', 'tch together'], ['wh', 'wh at the start'], ['th', 'th together'], ['sh', 'sh together'],
  ['ch', 'ch together'], ['ck', 'ck together'], ['ph', 'ph says “f”'], ['kn', 'quiet k'], ['wr', 'quiet w'],
  ['ai', 'ai says “ay”'], ['ay', 'ay says “ay”'], ['ee', 'ee says “ee”'], ['ea', 'ea together'], ['oa', 'oa says “oh”'],
  ['oo', 'oo together'], ['ou', 'ou together'], ['ow', 'ow together'], ['oi', 'oi says “oy”'], ['oy', 'oy says “oy”'],
  ['ir', 'ir says “er”'], ['ur', 'ur says “er”'], ['er', 'er together'], ['ar', 'ar together'], ['or', 'or together'],
  ['al', 'al together'], ['ll', 'two l’s'], ['ss', 'two s’s'], ['ff', 'two f’s'], ['tt', 'two t’s'], ['pp', 'two p’s'], ['nn', 'two n’s']
];

function trickyFor(word) {
  if (TRICKY[word]) return { idx: TRICKY[word][0], tip: TRICKY[word][1] };
  for (const [p, tip] of PATTERNS) {
    const i = word.indexOf(p);
    if (i >= 0) return { idx: [...Array(p.length).keys()].map(k => k + i), tip };
  }
  if (word.length > 2 && /[^aeiou]e$/.test(word)) return { idx: [word.length - 1], tip: 'quiet e at the end' };
  if (word.length > 1 && word.endsWith('y')) return { idx: [word.length - 1], tip: 'y at the end' };
  return { idx: [], tip: '' };
}

/* Misspellings for "Fix It!" and "Spelling Detective": simple rules, no dictionary needed.
   REAL_WORDS stops a "misspelling" from accidentally being a real word (like here → her). */
const REAL_WORDS = new Set(('her here were where well will wall now know knew new note not nut net one on won ate at eight rid red read ride rode ' +
  'run ran thin then than them theme the they their there fat sea see sun son soon butt but bot pot put most must fur fore for four ' +
  'hem him ham hum hut hot hat hit bit bet bat cut cat cot mat met man men mad mud bed bad bud bid sit sat set pin pen pan pun fin fan fun ' +
  'tin ten tan top tip tap mop map sip sap lot lit let got get gut wet wit hug hog dog dig dug pet pit pat bye by buy to too two toe no ' +
  'so sew sow be bee eye inn in is as us use an and it up am are any ant ask give live love move have hive came come cam same some sum ' +
  'son sin song all awl ill tall talk walk what when ever even over oven open hi he me my we wee she shoe who how hoe do doe due go goo ' +
  'was wise wish wash his hiss off of if fly flee free three tree there play pay say sea saw sew slow show snow blow blue glue ' +
  'came cane can cone one bone done gone tone lone line lane like lake lick luck look lock took take tuck tick ' +
  'find fond fund fine five dive done down dawn town tone torn turn first fast fist burst black block brown crown drown ' +
  'little lot loft far fir fern yes yet yell yellow fellow follow hollow eat at ate meat seat sat heat hat beat bat out our hour').split(' '));
function misspellings(word) {
  const out = [];
  const add = w => { if (w && w !== word && !out.includes(w) && !REAL_WORDS.has(w) && !SENTENCES[w]) out.push(w); };
  const swaps = [['ow', 'ou'], ['ou', 'ow'], ['al', 'aw'], ['ai', 'a'], ['ay', 'a'], ['ee', 'ea'], ['ea', 'ee'], ['oo', 'u'],
    ['ir', 'ur'], ['ur', 'er'], ['er', 'ur'], ['wh', 'w'], ['ck', 'k'], ['ph', 'f'], ['kn', 'n'], ['wr', 'r'], ['igh', 'i'],
    ['ll', 'l'], ['ss', 's'], ['tt', 't'], ['ff', 'f'], ['pp', 'p'], ['ch', 'sh'], ['ey', 'ay'], ['ie', 'ee']];
  for (const [a, b] of swaps) if (word.includes(a)) add(word.replace(a, b));
  if (/[^aeiou]y$/.test(word) && word.length > 2) { add(word.slice(0, -1) + 'ee'); add(word.slice(0, -1) + 'ey'); }
  if (/[^aeiou]e$/.test(word) && word.length > 2) add(word.slice(0, -1));
  const vowelSwap = { a: 'u', e: 'i', i: 'e', o: 'u', u: 'o' };
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (vowelSwap[c]) add(word.slice(0, i) + vowelSwap[c] + word.slice(i + 1));
  }
  for (let i = word.length - 1; i >= 1; i--) {
    const c = word[i];
    if (!'aeiouy'.includes(c) && word[i - 1] !== c && word[i + 1] !== c) add(word.slice(0, i) + c + word.slice(i));
  }
  if (word.length > 3 && /[aeiouy]/.test(word.slice(0, 1) + word.slice(2))) add(word.slice(0, 1) + word.slice(2));
  if (!/e$/.test(word)) add(word + 'e');
  if (word.length <= 2) { add(word + word.slice(-1)); add(word.split('').reverse().join('')); add(word + 'h'); }
  // Still short of three? Try every other vowel in each vowel spot.
  for (let i = 0; out.length < 3 && i < word.length; i++) {
    if ('aeiou'.includes(word[i])) for (const v of 'aeiou') add(word.slice(0, i) + v + word.slice(i + 1));
  }
  if (out.length < 3) add(word + 'h');
  if (out.length < 3) add(word[0] + word);
  return out;
}

      const finish = () => { alive = false; listenToken++; mark('Look & Say', x.dw, n >= 3, '', '', null, { text: m ? `He saw “${x.dw}” and said it out loud 3 times (the microphone heard each one).` : `He saw “${x.dw}” and tapped “I said it” 3 times (no microphone).`, clips }, [m ? `said it ${n} times` : `tapped ${n} times`]); items.at(-1).free = true; heard += n >= 3 ? 1 : 0; setMsg('Great saying!', 'good'); nextUp(1100).then(done); };
      const listenLoop = async () => {
        while (alive && n < 3) {
          await quiet();
          if (!alive) return;
          setMsg(n === 0 ? 'Now say it out loud!' : n === 1 ? 'Say it again!' : 'One more time!');
          const r = talkMode() === 'button' ? await speakNow($('talkBox'), { minMs: 500, maxMs: 8000, what: 'Say it now!' }) : await listenForVoice((lvl, over) => { const f = $('mfill'); if (f) { f.style.width = Math.round(lvl * 100) + '%'; f.style.background = over ? 'var(--good)' : 'var(--try)'; } }, () => { setMsg('I’m listening… say it out loud!', 'try'); say('Say it out loud!', 1); });
          if (!r || !alive) continue;   // cancelled (he tapped Hear the word): listen again after it plays

        await playWord(x.w); $('saidBtn').disabled = false; setMsg('Say it out loud, then tap the button.');

  };
  // Trace with a finger (touch screen) or the mouse, over the big gray word. Done checks every letter got traced and he stayed on the letters.
  let usedPen = false;   // remembered for the whole worksheet
  const trace = async () => {
    let redo = 0;
    try { await document.fonts.load('700 140px Andika'); } catch (e) { }
    await each(W.length, i => new Promise(done => {
      const x = W[i], word = x.dw;
      app.innerHTML = head('Trace the word with your finger. Say each letter as you trace it.') + count(i, W.length)
        + `<button class="btn" id="hear">${SPK}Hear the word</button><div class="tracebox"><canvas id="tc"></canvas></div><div class="message" id="msg"></div>
        <div class="row acts"><button class="btn big" id="undoBtn">↶ Undo</button><button class="btn big" id="eraseBtn" aria-pressed="false">🧽 Eraser</button><button class="btn big" id="clearBtn">↺ Start over</button><button class="btn big primary" id="doneBtn">Done ✓</button></div>`;
      $('hear').onclick = () => playWord(x.w); playWord(x.w);
      const cv = $('tc'), dpr = window.devicePixelRatio || 1, Wd = Math.min(900, window.innerWidth - 40), Ht = 240;
      cv.width = Wd * dpr; cv.height = Ht * dpr; cv.style.width = Wd + 'px'; cv.style.height = Ht + 'px';
      const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      let fs = 170; const font = s => `700 ${s}px Andika, sans-serif`;
      ctx.font = font(fs); while (ctx.measureText(word).width > Wd * 0.88 && fs > 50) { fs -= 6; ctx.font = font(fs); }
      const tw = ctx.measureText(word).width, x0 = (Wd - tw) / 2, base = Ht / 2 + fs * 0.33;
      // letter spans (for "trace the orange letter too")
      const spans = [...word].map((ch, k) => ({ ch, a: x0 + ctx.measureText(word.slice(0, k)).width, b: x0 + ctx.measureText(word.slice(0, k + 1)).width })).filter(s => isLetter(s.ch));
      const make = () => { const c = document.createElement('canvas'); c.width = Wd; c.height = Ht; const g = c.getContext('2d'); g.font = font(fs); g.textBaseline = 'alphabetic'; return [c, g]; };
      const [core, cg] = make(); cg.fillText(word, x0, base);                                                   // the letters themselves
      const [near, ng] = make(); ng.lineWidth = Math.max(18, fs * 0.16); ng.lineJoin = 'round'; ng.strokeText(word, x0, base); ng.fillText(word, x0, base);   // the letters + a little room
      const [ink, ig] = make(); ig.lineCap = ig.lineJoin = 'round'; ig.lineWidth = Math.max(16, fs * 0.13);
      const coreD = cg.getImageData(0, 0, Wd, Ht).data, nearD = ng.getImageData(0, 0, Wd, Ht).data;
      let strokes = [], cur = null, orange = new Set(), redoHere = 0;
      const draw = () => {
        ctx.clearRect(0, 0, Wd, Ht); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, Wd, Ht);
        ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(10, base); ctx.lineTo(Wd - 10, base); ctx.stroke(); ctx.setLineDash([]);
        ctx.font = font(fs); [...word].forEach((ch, k) => { const s = spans.find(z => z.a === x0 + ctx.measureText(word.slice(0, k)).width); ctx.fillStyle = s && orange.has(s) ? '#FDBA74' : '#CBD5E1'; ctx.fillText(ch, x0 + ctx.measureText(word.slice(0, k)).width, base); });
        ctx.strokeStyle = '#2563EB'; ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(10, fs * 0.08);

      const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * Wd / r.width, (e.clientY - r.top) * Ht / r.height]; };
      // Apple Pencil: once a pen is used, his palm or finger resting on the screen is ignored (only one line draws at a time)
      let penId = null;
      cv.onpointerdown = e => { e.preventDefault(); if (e.pointerType === 'pen') usedPen = true; if ((usedPen && e.pointerType === 'touch') || (cur && penId !== e.pointerId)) return; penId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (er) { } cur = [pt(e)]; strokes.push(cur); draw(); };
      cv.onpointermove = e => { if (!cur || e.pointerId !== penId) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (evs.length ? evs : [e]).forEach(ev => cur.push(pt(ev))); draw(); };
      cv.onpointerup = cv.onpointercancel = e => { if (e.pointerId === penId) { cur = null; penId = null; } };
      $('clearBtn').onclick = () => { strokes = []; orange.clear(); setMsg(''); draw(); };
      $('undoBtn').onclick = () => { if (cur) return; strokes.pop(); setMsg(''); draw(); };
      if (typeof padTools === 'function') padTools({ cv, get: () => strokes, set: v => { strokes = v; }, pt, redraw: () => draw(), radius: 16, eraseBtn: $('eraseBtn'), undoBtn: $('undoBtn'), clearBtn: $('clearBtn'), changed: () => setMsg('') });
      $('doneBtn').onclick = () => {
        if (!strokes.length) return setMsg('Use your finger to trace the gray letters.', 'try');
        ig.clearRect(0, 0, Wd, Ht);
        strokes.forEach(st => { ig.beginPath(); st.forEach(([px, py], k) => k ? ig.lineTo(px, py) : ig.moveTo(px, py)); if (st.length === 1) ig.lineTo(st[0][0] + 0.1, st[0][1]); ig.stroke(); });
        const inkD = ig.getImageData(0, 0, Wd, Ht).data;
        let inkAll = 0, inkOut = 0; const per = spans.map(() => [0, 0]);
        for (let py = 0; py < Ht; py += 3) for (let px = 0; px < Wd; px += 3) {
          const o = (py * Wd + px) * 4 + 3, isInk = inkD[o] > 40;
          if (isInk) { inkAll++; if (nearD[o] < 40) inkOut++; }
          if (coreD[o] > 100) { const s = spans.findIndex(z => px >= z.a && px < z.b); if (s >= 0) { per[s][1]++; if (isInk) per[s][0]++; } }
        }
        const missedL = spans.filter((s, k) => per[k][1] && per[k][0] / per[k][1] < 0.45);
        const outside = inkAll ? inkOut / inkAll : 1;
        orange = new Set(missedL);
        if (outside > 0.4) { redo++; redoHere++; draw(); setMsg('Stay on the gray letters. Tap ↶ Undo or Start over and trace them carefully.', 'try'); fb('Stay on the gray letters.', 0.95); return; }
        if (missedL.length) { redo++; redoHere++; draw(); setMsg(`Trace the orange letter${missedL.length > 1 ? 's' : ''} too: ${missedL.map(s => s.ch).join(', ')}.`, 'try'); fb(`Trace the orange letter${missedL.length > 1 ? 's' : ''} too.`, 0.95); return; }
        try { const sm = document.createElement('canvas'); sm.width = 360; sm.height = Math.round(360 * Ht / Wd); sm.getContext('2d').drawImage(cv, 0, 0, sm.width, sm.height); (extra.traces = extra.traces || []).push({ word, img: sm.toDataURL('image/png'), redo: redoHere }); } catch (er) { }   // a small picture of his tracing for Parent Review
        setMsg('Beautiful tracing!', 'good'); fb(word, 0.85); nextUp(1300).then(done);
      };
    }));
    partDone(redo ? `All traced! (${redo} time${redo > 1 ? 's' : ''} he had to trace a bit more.)` : 'Every word traced neatly!');
  };
  // Cover & Write, then Check letter by letter.
  /* Nov 11, 2026 (Dylan: "I don't want him to get stuck on an endless loop if he can't get it right… like the wordle section in the
     rainbow write"): try 1 wrong → look at the word again (as before); tries 2–3 wrong → every try stays on the screen in Wordle colors
     and letters that aren't in the word go red and lock on the keyboard; try 4 wrong → also the letters he's missing; try 5 wrong → the
     word stays up and he copies it. Needing the colors (2+ wrong) counts as deep help for the warm-up. */
  const coverWrite = async () => {
    setDeepParts();
    await each(W.length, i => new Promise(done => {
      const x = W[i], target = x.dw.replace(/[^A-Za-z ]/g, ''), tgt = norm(target).replace(/ /g, '');
      let first = null, tries = 0; const tried = [];
      const look = (again) => {
        onKey = null;
        app.innerHTML = head(again ? 'Look again at the tricky part. Then cover it and fix it.' : 'Look at the word. When you’re ready, cover it and write it from memory.') + count(i, W.length)
          + `<div class="big-word">${hl(x)}</div>${x.tip ? `<div class="tipline">Tricky part: ${esc(x.tip)}</div>` : ''}
          <div class="row"><button class="btn" id="hear">${SPK}Hear the word</button><button class="btn big primary" id="cover">Cover it 🙈</button></div>`;
        $('hear').onclick = () => playWord(x.w);
        $('cover').onclick = () => write();
        if (!again) playWord(x.w);
      };
      const write = () => {
        let typed = '';
        const copy = tries >= 5, hints = tries >= 2;
        const sub = copy ? 'Look at the word and type it. You can see it this time.' : hints ? 'Use the colors from your tries. Type the whole word again.' : 'Write it from memory. No peeking!';
        app.innerHTML = head(sub) + count(i, W.length) + (copy ? `<div class="big-word">${esc(x.dw)}</div>` : `<div class="hidden-word">The word is covered</div>`)
          + (hints && !copy ? wordleHtml(tried.map(t => norm(t).replace(/ /g, '')), tgt, tries === 4 ? missingLetters(norm(tried.at(-1)).replace(/ /g, ''), tgt) : null) : '') + `<div id="io"></div>`;
        $('io').innerHTML = `<div class="boxes" id="ans"></div><div class="message" id="msg"></div>${keysHtml()}
          <div class="row acts"><button class="btn big" id="backBtn">⌫ Back</button><button class="btn big primary" id="doneBtn" disabled>Check ✓</button></div>`;
        if (hints) { tried.forEach(t => redOut(norm(t), tgt)); if (tries === 4 && !copy) paintKeys(missingLetters(norm(tried.at(-1)).replace(/ /g, ''), tgt)); }
        const draw = () => { $('ans').innerHTML = boxes(typed, 'typed') + '<span class="lbox cur"></span>'; $('doneBtn').disabled = !typed; };
        draw();
        onKey = c => { if (redKeys.has(c)) return setMsg(`${c} isn’t in the word. Try a different letter.`, 'try'); if (typed.length < 24) { typed += c; draw(); } };
        $('backBtn').onclick = () => { typed = typed.slice(0, -1); draw(); };
        $('doneBtn').onclick = () => {
          onKey = null;
          if (first === null) first = typed; tried.push(typed);
          const right = norm(typed) === norm(target);
          // Check: each letter green if it matches the word, red if not
          const T = [...target.replace(/ /g, '')];
          $('ans').innerHTML = [...typed].map((c, k) => `<span class="lbox ${T[k] && T[k].toLowerCase() === c ? 'rightl' : 'wrongl'}">${esc(c)}</span>`).join('');
          $('backBtn').disabled = $('doneBtn').disabled = true;
          if (right) {
            if (tries >= 2) noteDeep('Cover & Write', x.w);
            mark('Cover & Write', x.dw, tries === 0, first, x.dw, x.w, { text: `Saw “${x.dw}”, then it was covered. He wrote it from memory.${tries >= 5 ? ' (After 5 tries the word stayed up and he copied it.)' : tries >= 2 ? ' (He used the Wordle colors.)' : ''}` }, tried);
            setMsg(tries ? 'You fixed it!' : 'Yes! Right from memory!', 'good');
            fb(tries ? 'You fixed it!' : 'Yes!', 1); nextUp(1300).then(done);
            return;
          }
          tries++;
          if (tries === 1) {
            setMsg('Check: the red letters don’t match. Let’s look again.', 'try');
            fb('Not quite. Let’s look again.', 0.95); nextUp(2000, 'Let’s look at it again…').then(() => look(true));
          } else if (tries >= 5) {
            setMsg(tries === 5 ? 'Here’s the word. Look at it and type it.' : 'Look closely at every letter, and type it again.', 'try');
            fb(tries === 5 ? 'Look at the word, and type it.' : 'Look closely at every letter.', 0.95); nextUp(1600, 'Here comes the word…').then(write);
          } else {
            setMsg(tries === 4 ? 'Not quite. Here are the letters you’re missing. Look at the colors.' : 'Not quite. Look at the colors: green is in the right spot, yellow goes somewhere else, red isn’t in the word.', 'try');
            fb(tries === 2 ? 'Not quite. Look at the colors. Green is right. Yellow is in the word, but in a different spot. Red is not in the word.' : 'Not quite. Here are the letters you are missing.', 0.95);
            nextUp(1800, 'Look at the colors…').then(write);
          }
        };
      };
      look(false);
    }));
    partDone(firstTry('Cover & Write') + '.');
  };
  // Word Shapes: which word fits the shape? Tall letters stick up, hanging letters go down. If two words have the same shape,
  // the first letter(s) are shown so there's only one answer. Words already used drop out of the bank.
  const shapes = async () => {
    const TALL = 'bdfhklt', TAIL = 'gjpqy';
    const kind = ch => (ch === 'I' || TALL.includes(ch)) ? 'T' : TAIL.includes(ch) ? 'G' : 's';
    const sig = dw => [...dw].filter(isLetter).map(kind).join('');
    const shape = (word, c, show = 0, fillIn = false) => {
      const u = 40; let x = 0, r = '', n = 0;
      for (const ch of word) {
        if (!isLetter(ch)) { x += 16; continue; }
        const [y, h] = kind(ch) === 'T' ? [0, 60] : kind(ch) === 'G' ? [24, 60] : [24, 36];
        r += `<rect x="${x + 2}" y="${y + 2}" width="${u - 4}" height="${h - 4}" rx="6" fill="#FFFFFF" stroke="${c}" stroke-width="3"/>`;
        if (fillIn || n < show) r += `<text x="${x + u / 2}" y="53" text-anchor="middle" font-family="Andika, sans-serif" font-size="34" font-weight="700" fill="${n < show && !fillIn ? c : '#1F2937'}">${esc(ch)}</text>`;
        x += u; n++;
      }
      return `<svg width="${x}" height="86" viewBox="0 0 ${x} 86" aria-hidden="true">${r}</svg>`;
    };
    // how many first letters to show so no other word fits the same shape
    const hintLen = x => { const others = W.filter(y => y !== x && sig(y.dw) === sig(x.dw)); if (!others.length) return 0; let k = 1; while (k < x.dw.length && others.some(y => y.dw.slice(0, k).toLowerCase() === x.dw.slice(0, k).toLowerCase())) k++; return k; };

      <span><svg width="18" height="42"><rect x="1" y="13" width="16" height="16" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="2"/></svg>short letters<br><b>a c e m n o r s…</b></span>
      <span><svg width="18" height="42"><rect x="1" y="13" width="16" height="28" rx="3" fill="#fff" stroke="#94A3B8" stroke-width="2"/></svg>hanging letters<br><b>g j p q y</b></span></div>`;
    const order = shuffle(W.map((_, i) => i), seed), used = new Set();
    await each(order.length, n => new Promise(done => {
      const x = W[order[n]], c = COLORS[n % COLORS.length], hl = hintLen(x); let missed = false, pickedWrong = ''; const tapped = [];
      app.innerHTML = head('Which word fits this shape? Count the boxes. Look for tall and hanging letters.') + `<div class="count">Shape ${n + 1} of ${order.length}${hl ? ` · Hint: it starts with “${esc(x.dw.slice(0, hl))}”` : ''}</div>
        <div class="shape-wrap" id="shape">${shape(x.dw, c, hl)}</div>${legend}
        <div class="bank">${W.map(y => `<button class="pill${used.has(y.w) ? ' used' : ''}" data-w="${esc(y.w)}" ${used.has(y.w) ? 'disabled' : ''}>${esc(y.dw)}</button>`).join('')}</div><div class="message" id="msg"></div>`;
      app.querySelector('.bank').onclick = e => {
        const b = e.target.closest('[data-w]'); if (!b || b.disabled) return;
        tapped.push(displayWord(b.dataset.w));
        if (b.dataset.w === x.w) {
          b.classList.add('right'); app.querySelectorAll('.bank .pill').forEach(p => p.disabled = true); used.add(x.w);
          $('shape').innerHTML = shape(x.dw, c, 0, true);
          mark('Word Shapes', x.dw, !missed, missed ? pickedWrong : x.dw, x.dw, null, { html: shape(x.dw, c, hl), text: `A shape of ${[...x.dw].filter(isLetter).length} boxes (${sig(x.dw).replace(/T/g, 'tall ').replace(/G/g, 'hanging ').replace(/s/g, 'short ').trim()})${hl ? `, hint: starts with “${x.dw.slice(0, hl)}”` : ''}`, choices: W.filter(y => !used.has(y.w) || y.w === x.w).map(y => y.dw) }, tapped);
          setMsg('Yes! It fits!', 'good'); playWord(x.w); nextUp(1300).then(done);
        } else {
          if (!missed) pickedWrong = b.dataset.w; missed = true; b.classList.add('wrong'); b.disabled = true; shakeEl(b);
          const y = W.find(z => z.w === b.dataset.w), boxesN = [...x.dw].filter(isLetter).length, yN = [...y.dw].filter(isLetter).length;
          setMsg(yN !== boxesN ? `“${y.dw}” has ${yN} letters. The shape has ${boxesN} boxes.` : `“${y.dw}” has the wrong tall or hanging letters. Look again.`, 'try');
        }
      };
    }));
    partDone(firstTry('Word Shapes') + '.');
  };
  const missing = async () => {
    setDeepParts();
    const order = shuffle(W.map((_, i) => i).filter(i => W[i].w.length > 1), seed + 3);
    await each(order.length, async n => {
      const x = W[order[n]];
      let b = x.idx.length ? x.idx.slice(0, 3) : [Math.floor(x.w.length / 2)];
      if (b.length >= x.w.length) b = [x.w.length - 1];
      b = b.filter(i => isLetter(x.dw[i])); if (!b.length) b = [[...x.dw].findIndex(isLetter)];
      app.innerHTML = head('Fill in the missing letters.') + `<div class="count">Word ${n + 1} of ${order.length}</div><button class="btn" id="hear">${SPK}Hear the word</button><div id="io"></div>`;
      $('hear').onclick = () => playWord(x.w); playWord(x.w);
      const miss = await guided({ word: x.dw, fill: b, hint: 'Think about how the word looks. Try another letter.' });
      if (guided.deep) noteDeep('Missing Letters', x.w);
      mark('Missing Letters', x.dw, miss === 0, '', x.dw, x.w, { text: `He saw “${[...x.dw].map((ch, k) => b.includes(k) ? '_' : ch).join('')}” and filled in the blanks.` }, [guided.keys.join(' ')]);
      setMsg(miss ? 'You filled it in!' : 'Yes! Right the first time!', 'good'); fb(x.dw, 0.85); await nextUp(1300);
    });
    partDone(firstTry('Missing Letters') + '.');
  };
  const sentences = async () => {
    setDeepParts();
    const withS = W.filter(x => (SD.sentences && SD.sentences[x.w] || '').includes('___'));
    const order = shuffle(withS.map((_, i) => i), seed + 5);
    await each(order.length, async n => {
      const x = withS[order[n]], s = SD.sentences[x.w], [a, b] = s.split('___');
      app.innerHTML = head('Finish the sentence. Type a word from the Word Bank.') + `<div class="count">Sentence ${n + 1} of ${order.length}</div>
        <div class="sentence">${esc(a)}<span class="blankbox"></span>${esc(b)}</div>
        <div class="bank">${W.map(y => `<span class="pill show" data-bw="${esc(norm(y.dw))}">${esc(y.dw)}</span>`).join('')}</div>
        <button class="btn" id="hear">${SPK}Hear the sentence</button><div id="io"></div>`;
      $('hear').onclick = () => lockKeysFor(sayBlank(s)); lockKeysFor(sayBlank(s));
      /* Nov 11 (Dylan: "if he tries a word and it doesn't work, cross it out on the list… marking keys that are blatantly wrong"):
         a word-bank word he tried gets crossed out, and letters he typed that aren't in the answer go red and lock */
      const ans = norm(x.dw);
      const r = await freeType({ answer: x.dw, hint: 'Not quite. Read the sentence again. Which word fits?', onMiss: t => {
        const tn = norm(t); app.querySelectorAll('.bank .pill').forEach(p => { if (p.dataset.bw === tn) p.classList.add('wrong'); });
        redOut(tn, ans);
      } });
      if (r.tries >= 2) noteDeep('Finish the Sentence', x.w);   // the word was spelled out for him
      mark('Finish the Sentence', s, r.ok, r.typed, x.dw, x.w, { text: s, bank: W.map(y => y.dw) }, r.attempts);
    });
    partDone(firstTry('Finish the Sentence') + '.');
  };
  PARTS = [{ name: 'Look & Say', run: lookSay }, { name: 'Trace', run: trace }, { name: 'Cover & Write', run: coverWrite }, { name: 'Word Shapes', run: shapes }];
  if (SD.noSay) PARTS = PARTS.filter(p => p.name !== 'Look & Say');   // daily routine: he already said each word 3 times in Look & Listen
  if (W.some(x => x.w.length > 1)) PARTS.push({ name: 'Missing Letters', run: missing });
  if (W.some(x => (SD.sentences && SD.sentences[x.w] || '').includes('___'))) PARTS.push({ name: 'Finish the Sentence', run: sentences });
  return { intro: `${W.length} words · ${PARTS.length} parts.`, words: W.map(x => x.dw) };
}

/* ================= Word Master Challenge: Fix It!, Picture Sentences, Spelling Detective. A test: one try each. ================= */
function masterSheet() {
  const words = SD.words || [], seed = seedOf(words);
  // 4 wrong spellings for Spelling Detective (5 choices on screen; the paper has 3). The Fix It! one isn't reused.
  const wrongFor = (w, m) => {
    const out = [], add = x => { if (x && x !== w && x !== m[0] && !out.includes(x) && !REAL_WORDS.has(x)) out.push(x); };
    m.slice(1).forEach(add);
    for (let i = 0; i < w.length - 1; i++) if (w[i] !== w[i + 1]) add(w.slice(0, i) + w[i + 1] + w[i] + w.slice(i + 2));   // two letters swapped
    add(w + w.slice(-1)); add(w.slice(0, -1)); add(w + 'e'); add(w[0] + w);
    return out.slice(0, 4);
  };
  const W = words.map(w => { const m = misspellings(w); return { w, dw: displayWord(w), fix: m[0] || w + 'e', wrong: wrongFor(w, m) }; });
  const fixIt = async () => {
    const order = shuffle(W.map((_, i) => i), seed);
    await each(order.length, async n => {
      const x = W[order[n]];
      app.innerHTML = head('This word is spelled wrong. Type it the right way.') + `<div class="count">Word ${n + 1} of ${order.length}</div>
        <div class="oops">${esc(displayWord(x.fix))}</div><button class="btn" id="hear">${SPK}Hear the word</button><div id="io"></div>`;
      $('hear').onclick = () => playWord(x.w); playWord(x.w);
      const r = await freeType({ answer: x.dw, test: true });
      mark('Fix It!', displayWord(x.fix), r.ok, r.typed, x.dw, x.w, { text: `He saw the wrong spelling “${displayWord(x.fix)}” and typed it the right way.` }, r.attempts);
      setMsg(r.ok ? 'Right!' : `The right way: ${x.dw}`, r.ok ? 'good' : 'try'); await nextUp(r.ok ? 1200 : 2200);
    });
    partDone(firstTry('Fix It!').replace(' the first time', '') + '.');
  };
  const pictures = async () => {
    const order = shuffle(W.map((_, i) => i), seed + 1).filter(k => (SD.sentences && SD.sentences[W[k].w] || '').includes('___'));
    await each(order.length, async n => {
      const x = W[order[n]], s = SD.sentences[x.w], [a, b] = s.split('___'), ic = SD.icons && SD.icons[x.w];
      app.innerHTML = head('Type the missing word.') + `<div class="count">Sentence ${n + 1} of ${order.length}</div>
        ${pic(ic, 96)}<div class="sentence">${esc(a)}<span class="blankbox"></span>${esc(b)}</div>
        <button class="btn" id="hear">${SPK}Hear the sentence</button><div id="io"></div>`;
      $('hear').onclick = () => lockKeysFor(sayBlank(s)); lockKeysFor(sayBlank(s));
      const r = await freeType({ answer: x.dw, test: true });
      mark('Picture Sentences', s, r.ok, r.typed, x.dw, x.w, { text: s, html: ic ? pic(ic, 110) : '' }, r.attempts);
      setMsg(r.ok ? 'Right!' : `The word was: ${x.dw}`, r.ok ? 'good' : 'try'); await nextUp(r.ok ? 1200 : 2200);
    });
    partDone(firstTry('Picture Sentences').replace(' the first time', '') + '.');
  };
  const detective = async () => {
    const order = shuffle(W.map((_, i) => i), seed + 2);
    await each(order.length, n => new Promise(done => {
      const x = W[order[n]], opts = shuffle([x.w, ...x.wrong], seed + n * 7);
      app.innerHTML = head('Tap the word that is spelled right. One try!') + `<div class="count">Word ${n + 1} of ${order.length}</div>
        <button class="btn" id="hear">${SPK}Hear the word</button>
        <div class="opts five">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(displayWord(o))}</button>`).join('')}</div><div class="message" id="msg"></div>`;
      $('hear').onclick = () => playWord(x.w); playWord(x.w);
      app.querySelector('.opts').onclick = e => {
        const b = e.target.closest('[data-o]'); if (!b || b.disabled) return;
        app.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.dataset.o === x.w) o.classList.add('right'); });
        const ok = b.dataset.o === x.w; if (!ok) b.classList.add('wrong');
        mark('Spelling Detective', x.dw, ok, displayWord(b.dataset.o), x.dw, x.w, { text: 'Tap the word that is spelled right.', choices: opts.map(displayWord) }, [displayWord(b.dataset.o)]);
        setMsg(ok ? 'Good detective work!' : 'The green one is spelled right.', ok ? 'good' : 'try');
        nextUp(ok ? 1200 : 2200).then(done);
      };
    }));
    partDone(firstTry('Spelling Detective').replace(' the first time', '') + '.');
  };
  PARTS = [{ name: 'Fix It!', run: fixIt }];
  if (W.some(x => (SD.sentences && SD.sentences[x.w] || '').includes('___'))) PARTS.push({ name: 'Picture Sentences', run: pictures });
  PARTS.push({ name: 'Spelling Detective', run: detective });
  extra.stars = true;
  return { intro: `${W.length} words · No peeking! One try for each answer.`, words: W.map(x => x.dw) };
}

/* ================= What Is the Question Asking?: circle the "What ___" words, say what kind of answer it wants, answer it ================= */
function questionSheet() {
  let list = (SD.items || []).slice();
  if (SD.example) list = list.filter(x => !(x.answer === 'cow' && x.kind === 'animal'));
  const kinds = [...new Set(list.map(x => x.kind))];
  const answers = [...list].sort((a, b) => a.answer.localeCompare(b.answer));
  const SC = ['#3C7DD9', '#EA580C', '#16A34A'];
  const step = (n, t) => `<div class="qstep"><span class="n" style="background:${SC[n - 1]}">${n}</span><span>${t}</span></div>`;
  const ask = (it, k) => async () => {
    const toks = it.q.split(/\s+/);
    const lead = ('what ' + it.kind).split(' ').length;
    const canCircle = norm(toks.slice(0, lead).join(' ')) === norm('what ' + it.kind);
    const label = it.q;
    const got = [];
    const top = () => head('Read the question carefully.') + `<div class="qline" id="qline">${toks.map((t, i) => `<button class="qtok" data-t="${i}">${esc(t)}</button>`).join('')}</div>
      <button class="btn" id="hear">${SPK}Hear the question</button><div class="qgot" id="qgot"></div>`;
    app.innerHTML = top() + `<div id="stepbox"></div>`;
    $('hear').onclick = () => say(it.q, 0.85); say(it.q, 0.85);
    const showGot = () => { $('qgot').innerHTML = got.map(([a, b]) => `<span>${esc(a)}: <b>${esc(b)}</b></span>`).join(''); };
    // 1. circle the What ___ words
    if (canCircle) await new Promise(done => {
      let tries = 0; const on = new Set(), circled = [];
      $('stepbox').innerHTML = step(1, 'Tap the <b>What ___</b> words to circle them.') + `<div class="message" id="msg"></div><div class="row"><button class="btn big primary" id="doneBtn">Check ✓</button></div>`;
      $('qline').onclick = e => { const b = e.target.closest('[data-t]'); if (!b || b.classList.contains('locked')) return; const i = +b.dataset.t; on.has(i) ? on.delete(i) : on.add(i); b.classList.toggle('on', on.has(i)); };
      $('doneBtn').onclick = () => {
        const right = on.size === lead && [...Array(lead).keys()].every(i => on.has(i)); circled.push(toks.filter((_, i) => on.has(i)).join(' ') || '(nothing)');
        if (right) {
          mark('Circle the What words', label, tries === 0, circled[0], toks.slice(0, lead).join(' '), null, { text: it.q }, circled);
          app.querySelectorAll('.qtok').forEach(b => b.classList.add('locked')); setMsg('Yes! Those words tell you what kind of answer.', 'good');
          fb('Yes!', 1); nextUp(1100, 'Next step coming…').then(done);
        } else { tries++; setMsg('Find the word “What” and the word right after it that tells what kind of answer.', 'try'); shakeEl($('qline')); }
      };
    }); else app.querySelectorAll('.qtok').forEach(b => b.classList.add('locked'));
    // 2. what kind of answer? 3. the answer
    const pickOrType = (n, part, prompt, answer, bank, iconOf) => new Promise(done => {
      if (SD.wordBank) {
        let missed = false, firstPick = ''; const picked = [];
        $('stepbox').innerHTML = step(n, prompt) + `<div class="bank" id="bank">${bank.map(v => `<button class="pill" data-v="${esc(v)}">${iconOf ? `<span class="pic">${icon(iconOf(v), 30)}</span>` : ''}${esc(v)}</button>`).join('')}</div><div class="message" id="msg"></div>`;
        $('bank').onclick = e => {
          const b = e.target.closest('[data-v]'); if (!b || b.disabled) return;
          picked.push(b.dataset.v);
          if (noArticle(b.dataset.v) === noArticle(answer)) {
            b.classList.add('right'); $('bank').querySelectorAll('.pill').forEach(p => p.disabled = true);
            mark(part, label, !missed, missed ? firstPick : b.dataset.v, answer, null, { text: it.q, choices: bank, choiceHtml: iconOf ? Object.fromEntries(bank.map(v => [v, iconOf(v) ? `<span class="pic">${icon(iconOf(v), 44)}</span>` : ''])) : null }, picked);
            setMsg('Yes!', 'good'); fb(b.dataset.v, 0.9); nextUp(1100, 'Next step coming…').then(done);
          } else {
            if (!missed) firstPick = b.dataset.v; missed = true; b.classList.add('wrong'); b.disabled = true; shakeEl(b);
            setMsg(n === 2 ? 'Look at the words you circled. What kind of answer do they want?' : `Read it again. It wants ${/^[aeiou]/.test(it.kind) ? 'an' : 'a'} ${it.kind}.`, 'try');
          }
        };
      } else {
        $('stepbox').innerHTML = step(n, prompt) + '<div id="io"></div>';
        freeType({ answer, match: (a, b) => noArticle(a) === noArticle(b), hint: n === 2 ? 'Look at the words you circled. What kind of answer do they want?' : `Read it again. It wants ${/^[aeiou]/.test(it.kind) ? 'an' : 'a'} ${it.kind}.` })
          .then(r => { mark(part, label, r.ok, r.typed, answer, null, { text: it.q }, r.attempts); done(); });
      }
    });
    await pickOrType(2, 'What kind of answer', SD.wordBank ? 'What <b>kind</b> of answer does it want? Tap it.' : 'What <b>kind</b> of answer does it want? Type it.', it.kind, kinds);
    got.push(['It wants', it.kind]); showGot();
    await pickOrType(3, 'The answer', SD.wordBank ? 'Now tap the <b>answer</b>.' : 'Now type the <b>answer</b>.', it.answer, answers.map(a => a.answer), v => (list.find(a => a.answer === v) || {}).icon);
    got.push(['Answer', it.answer]); showGot();
    await nextUp(1300, k < PARTS.length - 1 - (SD.example ? 1 : 0) ? 'Next question coming…' : 'Almost done…');
    const mine = items.filter(x => x.label === label);
    partSum.push([`Question ${k + 1}`, `${mine.filter(x => x.ok).length} of ${mine.length} steps right the first time`]);
    nextPart();
  };
  PARTS = list.map((it, k) => ({ name: `Question ${k + 1}`, run: ask(it, k) }));
  if (SD.example) PARTS.unshift({ name: 'Watch me', run: () => {
    app.innerHTML = head('Here’s how to do one.') + `<div class="example"><div><span class="circ">What animal</span> says “moo”?</div>
      <div>It wants: <b style="color:#FB923C">an animal</b></div><div>Answer: <b style="color:var(--good)">cow</b></div><div style="color:var(--muted)">Not “moo”! Moo is not an animal.</div></div>
      <button class="btn big primary" id="go">Now you try →</button>`;
    say('What animal says moo? The words what animal tell me it wants an animal. So the answer is cow. Not moo! Moo is not an animal.', 0.9);
    $('go').onclick = goNextPart;
  } });
  return { intro: `${list.length} question${list.length === 1 ? '' : 's'}. For each one: find the What words, say what kind of answer it wants, then answer it.` };
}

/* ================= Daily Steps: tap each step when it's done, in order. Keeps today's progress if he leaves and comes back. ================= */
function stepsSheet() {
  const steps = SD.steps || [], today = new Date().toDateString();
  const key = 'steps-progress';
  let prog = store(key);
  if (!prog || prog.aid !== A.id || prog.day !== today) prog = { aid: A.id, day: today, done: [] };
  const run = () => {
    const draw = () => {
      const k = prog.done.length;
      app.innerHTML = `<div class="part-title"><h2>${esc(SD.heading || 'My School Day Steps')}</h2><p>${esc(SD.sub || 'Do them in order, one at a time.')}</p></div>
        <div class="srows">${steps.map((s, i) => {
          const c = COLORS[i % COLORS.length], text = esc(s.text).replace(/\*([^*]+)\*/g, '<b class="em">$1</b>');
          const note = s.noteText && s.noteType !== 'none' ? `<div class="snote"><b>${s.noteType === 'tip' ? 'Tip' : 'Parent'}:</b> ${esc(s.noteText)}</div>` : '';
          const st = i < k ? 'done' : i === k ? 'next' : 'later';
          return `<div class="srow ${st}"><span class="num" style="background:${i < k ? 'var(--good)' : c}">${i < k ? '✓' : i + 1}</span>${pic(s.icon, 40)}<div class="txt">${text}${note}</div>
            ${i < k ? `<span class="when">${new Date(prog.done[i]).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span>` : i === k ? `<button class="btn primary" data-step="${i}">Done ✓</button>` : ''}</div>`;
        }).join('')}</div>
        ${(SD.reminders || []).filter(r => r.trim()).length ? `<div class="remind"><b>Remember:</b>${SD.reminders.filter(r => r.trim()).map(r => `<span>${esc(r)}</span>`).join('')}</div>` : ''}
        ${k > 0 && k < steps.length ? '<button class="btn" id="undo">Oops, undo the last step</button>' : ''}`;
      app.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
        prog.done.push(Date.now()); store(key, prog);
        fb(prog.done.length < steps.length ? 'Great! On to the next step.' : 'All done!', 0.95);
        if (prog.done.length >= steps.length) { extra.stepTimes = prog.done.slice(); partSum.push(['Steps', `all ${steps.length} done`]); return showResults(); }
        draw(); const nx = app.querySelector('.srow.next'); if (nx) nx.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
      if ($('undo')) $('undo').onclick = () => { prog.done.pop(); store(key, prog); draw(); };
    };
    draw();
  };
  PARTS = [{ name: 'Steps', run }];
  return { intro: `${steps.length} steps. Tap each one when it’s done, in order.`, skipIntro: prog.done.length > 0 };
}

    };
    show(0);
  };
  const count = () => {

/* ============ Grown-up PIN: on his device, every grown-up button asks for it after the hold (set on the grown-up's Daily Sight Words card).

      <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-x="cancel" class="pin-sm">Cancel</button><button data-n="0">0</button><button data-x="back" class="pin-sm">⌫</button></div></div>`;

    B: 'Great job! A little more practice and you’ll get them all.',
    C: 'Good try! Practice the tricky ones and take your time next time.',
    D: 'Keep practicing! Slow down, read carefully, and try your best.',
    F: 'This one was hard. Practice every day, take your time, and try your best. You can do it!'

  return { pct, letter, color, msg };
}

  const missed = [];
  items.filter(x => x.word && !x.ok).forEach(x => { if (!missed.find(m => m.word === x.word)) missed.push({ word: x.word, typed: '' }); });
  missed.forEach(m => { const t = items.find(x => x.word === m.word && !x.ok && x.typed && /^[a-z ]+$/i.test(x.typed) && x.typed.toLowerCase() !== m.word); if (t) m.typed = t.typed.toLowerCase(); });
  const rec = { id: Date.now().toString(36), t: Date.now(), aid: A.id, tool: A.tool, title: A.title, grade: g ? { pct: g.pct, letter: g.letter } : null, right, of: n, items, missed, parts: partSum, extra, sent: false };
  const wrong = A.tool === 'warmup' ? [] : items.filter(x => !x.ok);   // the warm-up is just practice: no “what to fix” list
  let stars = '';
  if (extra.stars) { const ws = [...new Set(items.filter(x => x.word).map(x => x.word))]; stars = `<div class="part-title"><h2 style="font-size:22px">My Word Master Stars</h2></div><div class="starrow">${ws.map(w => `<div>${STAR(items.filter(x => x.word === w).every(x => x.ok) ? '#FACC15' : 'transparent')}${esc(displayWord(w))}</div>`).join('')}</div>`; }
  const fixHref = `fixup.html?w=${encodeURIComponent(missed.map(m => `${m.word}:${m.typed}`).join('|'))}&from=${encodeURIComponent(A.title)}`;
  const doneHref = HOME;
  app.innerHTML = `<div class="part-title"><h2>You finished ${esc(A.title)}!</h2><p>${A.tool === 'steps' ? 'Every step is done.' : A.tool === 'eagles' && extra.count != null ? `You had ${extra.count} eagle${extra.count === 1 ? '' : 's'}.` : ''}</p></div>
    ${g ? `<div class="grade"><span class="letter" style="background:${g.color}">${g.letter}</span><span class="pct">${g.pct}%<small>${right} of ${n} right the first time</small></span></div><p class="grade-msg">${esc(g.msg)}</p>` : A.tool === 'steps' ? `<div>${STAR('#FACC15')}${STAR('#FACC15')}${STAR('#FACC15')}</div>` : ''}
    ${stars}
    ${wrong.length ? `<div class="part-title"><h2 style="font-size:22px">Let’s look at what to fix</h2></div><div class="sumlist">${wrong.map(x => `<div class="res no"><span class="mark">✗</span><div><div class="his">${esc(x.part)}: ${esc(x.label)}</div>${x.typed ? `<div class="his">You put <s>${esc(x.typed)}</s></div>` : ''}<div class="w">${esc(x.answer)}</div></div></div>`).join('')}</div>` : ''}
    ${partSum.length > 1 ? `<div class="sumlist">${partSum.map(([k, v]) => `<div class="sum"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
    <p class="note" id="sent">${TRY ? 'Trying it out: nothing was saved or emailed.' : 'Sending the results to your grown-up…'}</p>
    <div class="row">${DAILY ? `<a class="btn big primary" href="${doneHref}" style="text-decoration:none">Next: the quiz →</a>` : missed.length && !TRY ? `<a class="btn big primary" href="${fixHref}" style="text-decoration:none">Fix my tricky words →</a><a class="btn big" href="${doneHref}" style="text-decoration:none">Finished</a>` : `<a class="btn big primary" href="${doneHref}" style="text-decoration:none">Finished</a>`}</div>`;
  if (g) say(`You got ${right} out of ${n} right the first time. That’s ${g.pct} percent, a${'AF'.includes(g.letter) ? 'n' : ''} ${g.letter}. ${g.msg}${missed.length ? ' Next, let’s fix your tricky words.' : ''}`, 0.95);
  else say(A.tool === 'steps' ? 'You did every step! Great job!' : 'You finished! Great job!', 0.95);
  if (!wrong.length) confetti();
  saveAndSend(rec);
}
let lastRec = null;   // handed back to the daily routine (spell.html picks the warm-up words from it)
function saveAndSend(rec) {
  lastRec = rec;
  clearProg(); Math.random = nativeRandom;
  // Test day: keep it on this device only so his start screen shows it as done; End test puts his real copy back
  if (TESTDAY) { const log = store('sheet-log') || []; log.push(rec); putLog('sheet-log', log.slice(-40)); return; }
  if (TRY) return;
  const log = store('sheet-log') || []; log.push(rec); putLog('sheet-log', log.slice(-40));
  cloudSaveSheet(rec);
  if (!emailOn()) { const el = $('sent'); if (el) el.textContent = 'Saved for your grown-up in Parent Review.'; return; }
  rec.body = emailBody(rec);
  const box = store('sheet-outbox') || []; box.push(rec); store('sheet-outbox', box.slice(-20));
  sendOutbox().then(() => { const l = (store('sheet-log') || []).find(x => x.id === rec.id); const el = $('sent'); if (el) el.textContent = l && l.sent ? `For the grown-up: results emailed to ${RESULTS_EMAIL}.` : 'For the grown-up: the email couldn’t send right now. It will try again the next time the Spelling Helper opens.'; });
}
function emailBody(rec) {
  const g = rec.grade;
  const body = {
    _subject: `Worksheet: ${rec.title}${g ? ` ${g.pct}% ${g.letter}, ${rec.right} of ${rec.of} right` : ', done'} (${shortDate(rec.t)})`,
    'Date': new Date(rec.t).toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    'Worksheet': rec.title
  };
  if (g) body['Grade'] = `${g.pct}% (${g.letter}), ${rec.right} of ${rec.of} right the first time`;
  rec.parts.forEach(([k, v]) => { body[k] = v; });
  rec.items.filter(x => !x.ok).forEach((x, i) => { body[`Missed ${i + 1}. ${x.part}`] = `${x.label}${x.typed ? ` · he put "${x.typed}"` : ''} · right: ${x.answer}`; });
  if (rec.tool === 'eagles' && rec.extra.marks) body['His marks'] = rec.extra.marks.map((m, i) => `${i + 1}: ${m === 'has' ? 'eagle' : 'no eagle'}`).join(', ');
  if (rec.tool === 'steps' && rec.extra.stepTimes) body['Step times'] = rec.extra.stepTimes.map((t, i) => `${i + 1}. ${new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}`).join(', ');
  if (rec.missed.length) body['Words for Fix-Up'] = rec.missed.map(m => m.word).join(', ');
  body['Parent Review'] = location.origin + location.pathname.replace(/[^/]*$/, '') + 'spell.html#review';
  return body;
}
/* Sends one results email through the Apps Script mailer (same as the Spelling Helper and Fix-Up) */
async function postForm(body, attachments = []) {
  const save = (ok, msg) => { store('spell-send-status', { t: Date.now(), ok, msg }); return ok; };
  const payload = JSON.stringify({ subject: body._subject || 'The Study', rows: Object.entries(body).filter(([k]) => !k.startsWith('_')).map(([k, v]) => [k, String(v)]), attachments });
  const withTimeout = (opts) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000); return fetch(MAILER_URL, { ...opts, signal: c.signal }).finally(() => clearTimeout(t)); };
  try {
    const res = await withTimeout({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload, redirect: 'follow' });
    let j = {}; try { j = await res.json(); } catch (e) { }
    if (res.ok && (j.success === 'true' || j.success === true)) return save(true, '');
    return save(false, j.message ? `The mailer said: ${j.message}` : `The mailer answered with error ${res.status}`);
  } catch (e) {
    if (e && e.name === 'AbortError') return save(false, 'The mailer didn’t answer within 20 seconds. It will try again later.');
    try { await withTimeout({ method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload }); return save(true, 'Sent, but the reply couldn’t be read, so this one is unconfirmed. Check your inbox.'); }
    catch (e2) { return save(false, 'Couldn’t reach the mailer (no internet?). It will try again later.'); }
  }
}
let sending = false;
async function sendOutbox() {
  if (sending) return; sending = true;
  try {
    let box = store('sheet-outbox') || [];
    for (const rec of [...box]) {
      try {
        if (!(await postForm(rec.body || emailBody(rec)))) break;
        box = box.filter(x => x.id !== rec.id); store('sheet-outbox', box);
        const log = store('sheet-log') || []; const l = log.find(x => x.id === rec.id); if (l) { l.sent = true; store('sheet-log', log); }
      } catch (e) { break; }
    }
  } finally { sending = false; }
}
/* Save to the Study database (shared with the grown-up's device). Not signed in: stays on this device. */
async function cloudSaveSheet(rec) {
  const clean = JSON.parse(JSON.stringify(rec)); delete clean.body;
  const args = { key: `sheet:${rec.id}`, kind: 'sheet', t: rec.t, data: clean };
  try {
    const sb = sbClient(); if (!sb) throw 0;
    const { data } = await sb.auth.getSession(); if (!data.session) return;
    const r = await sb.from('study_log').upsert({ key: args.key, kind: 'sheet', t: new Date(rec.t).toISOString(), data: clean });
    if (r.error) throw r.error;
  } catch (e) { const q = store('study-cloud-queue') || []; q.push({ op: 'log', args }); store('study-cloud-queue', q.slice(-200)); }
}

      <p class="note">${PARTS.length > 1 ? `Part ${pi + 1} of ${PARTS.length}: ${esc(PARTS[pi].name)}` : esc(PARTS[pi].name)}${sp.step ? ` · ${sp.step} done in this part` : ''}</p>
      <button class="btn big primary" id="resumeGo">Pick up where I left off →</button>
